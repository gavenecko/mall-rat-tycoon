<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ff3d81">
<title>Mall Rat Tycoon</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fdf0f6;color:#222;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text;font:inherit}
#app{max-width:720px;margin:0 auto;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#ff4f9a,#ff7a59);color:#fff;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:800;box-shadow:0 2px 8px #0002}
.hr{display:flex;gap:6px;align-items:center}
.pill{background:#ffffffdd;color:#7a2350;padding:4px 9px;border-radius:20px;font-size:13px}
.pill.cash{color:#1a8f3a;font-size:15px;transition:transform .2s}
.bump{transform:scale(1.25)}
.icon{border:0;background:#ffffff33;color:#fff;border-radius:50%;width:32px;height:32px;font-size:16px}
#banner{background:#fff3c4;color:#6a4b00;padding:8px 12px;font-size:13px;border-bottom:2px solid #f0c000}
main{padding:10px 10px 90px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:2px solid #ff4f9a;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:6px 0;font-size:11px;display:flex;flex-direction:column;align-items:center;color:#444}
nav button span{font-size:22px}
nav button.on{background:#ffe0ef;font-weight:800;color:#c2185b}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;background:#ff4f9a;color:#fff;font-size:15px;box-shadow:0 2px 0 #c2185b;transition:transform .08s}
.btn:active{transform:scale(.95)}
.btn.alt{background:#5b5b6b;box-shadow:0 2px 0 #333}.btn.green{background:#2bb34a;box-shadow:0 2px 0 #1a7a30}
.btn:disabled{opacity:.4}
.btn.big{font-size:19px;padding:14px 24px;width:100%}
.card{background:#fff;border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px #0001}
.center{text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.item{background:#fff;border-radius:14px;padding:8px;text-align:center;box-shadow:0 1px 5px #0002;font-size:13px;position:relative;animation:fade .25s}
.item img{width:100%;max-width:120px;aspect-ratio:1;border-radius:12px;display:block;margin:0 auto 4px}
.item .nm{min-height:34px}
.item.eq{outline:3px solid #2bb34a}
.pr{color:#1a8f3a;font-weight:800}.was{text-decoration:line-through;color:#999;font-size:12px;margin-right:4px}
.badge{position:absolute;top:6px;left:6px;background:#ff1744;color:#fff;font-size:11px;font-weight:800;padding:2px 6px;border-radius:8px}
.badge.r{background:linear-gradient(90deg,#7b1fa2,#d4af37)}
.item button{width:100%;margin-top:4px;padding:8px}
.store{display:flex;align-items:center;gap:10px;padding:14px;border-radius:16px;color:#fff;margin-bottom:10px;font-weight:800;font-size:18px;cursor:pointer;box-shadow:0 3px 8px #0003}
.store small{display:block;font-weight:400;font-size:12px;opacity:.9}
.hs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.hs .item{flex:0 0 132px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;padding-bottom:4px}
.tabs button{border:0;border-radius:20px;padding:7px 12px;background:#eee;white-space:nowrap;font-size:13px}
.tabs button.on{background:#ff4f9a;color:#fff}
canvas{display:block;margin:0 auto;max-width:100%;touch-action:manipulation;border-radius:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;opacity:0;transition:.3s;z-index:20;pointer-events:none;max-width:90%;text-align:center;font-size:14px}
.float{position:fixed;left:50%;top:40%;font-weight:900;font-size:26px;z-index:21;pointer-events:none;animation:up 1s forwards;text-shadow:0 2px 0 #fff}
@keyframes up{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-80px);opacity:0}}
@keyframes fade{from{opacity:0;transform:scale(.95)}to{opacity:1}}
@keyframes bob{50%{transform:translateY(-4px)}}
.bob{animation:bob 2s ease-in-out infinite}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.ing{font-size:13px;padding:10px 2px;border-radius:12px;border:2px solid #ddd;background:#fff;font-weight:700}
.ing b{display:block;font-size:24px}
.ing:active{background:#ffe0ef}
.ticket{background:#fffbe0;border:2px dashed #e0b000;border-radius:10px;padding:8px;font-size:15px;flex:1}
.cust{font-size:44px}
.bar{height:10px;background:#eee;border-radius:5px;overflow:hidden;margin:6px 0}.bar div{height:100%;background:#2bb34a;width:100%}
.lbl{font-weight:800;margin:10px 0 4px;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid #ddd;background:#fff;border-radius:20px;padding:7px 12px;font-size:14px}
.chip.on{border-color:#ff4f9a;background:#ffe0ef;font-weight:800}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #ccc}
.sw.on{box-shadow:0 0 0 3px #ff4f9a}
input[type=text]{width:100%;padding:10px;border-radius:10px;border:2px solid #ddd;font-size:16px}
textarea{width:100%;height:80px;border-radius:10px;border:2px solid #ddd;padding:8px;font-size:12px;font-family:monospace}
.small{font-size:12px;color:#666}
.ach{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ach div{border-radius:10px;padding:6px;font-size:12px;background:#f3f3f3;opacity:.5}
.ach div.got{background:#fff4c2;opacity:1}
#overlay{position:fixed;left:0;right:0;bottom:70px;z-index:15;padding:10px;display:flex;justify-content:center}
#overlay[hidden]{display:none}
#overlay .card{max-width:520px;border:3px solid #ff4f9a;animation:fade .3s}
.slot{display:flex;gap:6px;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding:6px 0;font-size:13px}
.slot .btn{padding:6px 10px;font-size:13px}
.flash{animation:flash .3s}@keyframes flash{50%{background:#ffcdd2}}
.lock{opacity:.55}
header{gap:6px;flex-wrap:nowrap}.logo{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.hr{flex-shrink:0}
@media (max-width:400px){.logo span{display:none}.pill{padding:3px 7px;font-size:12px}.pill.cash{font-size:13px}.icon{width:30px;height:30px;font-size:15px}nav button{font-size:10px}nav button span{font-size:20px}}
.heat{display:inline-block;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:800;color:#fff}
nav button,.icon{position:relative}
.nb{position:absolute;top:1px;right:12%;background:#ff1744;color:#fff;border-radius:10px;font-size:10px;font-style:normal;padding:1px 5px;font-weight:800;line-height:14px}
.nb:empty{display:none}
#sheet{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.sheetbox{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 14px 24px;position:relative;animation:fade .2s}
.sheetbox h3{margin:0 36px 8px 0}
.sheetbox .x{position:absolute;top:10px;right:10px;background:#eee;color:#333}
.sheetbox .btn.big{margin-top:8px;font-size:15px}
.item .heart{position:absolute;top:4px;right:4px;border:0;background:#fff;border-radius:50%;width:30px;height:30px;font-size:15px;box-shadow:0 1px 3px #0003;padding:0;margin:0}
.stars{color:#f5a623;font-size:13px;letter-spacing:-1px}
.chat{background:#f0f2f5;border-radius:12px;padding:8px;margin:8px 0;max-height:230px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.bub{background:#fff;border-radius:14px;padding:6px 10px;max-width:80%;font-size:14px;align-self:flex-start}
.bub.me{background:#0084ff;color:#fff;align-self:flex-end}
.evt{background:linear-gradient(90deg,#ffe082,#ffab91);border-radius:14px;padding:10px 12px;margin-bottom:10px;font-weight:700}
.ohead{border-radius:14px;padding:10px 12px;margin-bottom:8px;color:#fff;font-weight:800;font-size:20px}
.steps{display:flex;gap:3px;margin-top:4px}.steps i{flex:1;height:6px;border-radius:3px;background:#ddd}.steps i.on{background:#2bb34a}
input[type=search],input[type=number]{width:100%;padding:10px;border-radius:10px;border:2px solid #ddd;font-size:16px}
/* ===================== v5 DESIGN SYSTEM ===================== */
:root{--brand:#ff3d81;--brand-d:#d81b60;--brand2:#7c4dff;--ink:#1d1a2b;--muted:#5f5b73;--bg:#f5f2fb;--bg2:#ece6f7;--card:#fff;--line:#e8e3f2;--ok:#12a150;--ok-d:#0b7a3b;--warn:#f59e0b;--bad:#e11d48;
 --r-s:10px;--r:16px;--r-l:22px;--sh1:0 1px 2px rgba(40,20,80,.06),0 2px 8px rgba(40,20,80,.06);--sh2:0 4px 14px rgba(40,20,80,.12),0 1px 3px rgba(40,20,80,.08);--sh3:0 12px 32px rgba(40,20,80,.22);
 --f-xs:12px;--f-s:13.5px;--f-m:15px;--f-l:18px;--f-xl:22px;--hdr:linear-gradient(120deg,#ff3d81 0%,#ff6f61 55%,#ffa94d 100%);--chip:#efeaf8;color-scheme:light}
[data-theme=dark]{--ink:#f1eefb;--muted:#b3aecb;--bg:#13111c;--bg2:#1b1828;--card:#211e30;--line:#322d47;--chip:#2c2840;--sh1:0 1px 2px rgba(0,0,0,.4);--sh2:0 4px 14px rgba(0,0,0,.45);--hdr:linear-gradient(120deg,#b0185a 0%,#a8324a 55%,#9c5a1e 100%);color-scheme:dark}
html{background:var(--bg)}
body{background:radial-gradient(1200px 500px at 50% -200px,var(--bg2),var(--bg));color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI Variable",system-ui,-apple-system,Roboto,sans-serif;font-size:var(--f-m);letter-spacing:.005em;min-height:100vh}
h3{font-size:var(--f-l);letter-spacing:-.01em}
header{background:var(--hdr);padding:8px 10px 8px 12px;min-height:56px;box-shadow:0 4px 18px rgba(216,27,96,.25);border-radius:0 0 18px 18px}
.logo{display:flex;align-items:center;gap:8px;font-size:17px;letter-spacing:-.01em}
.logo svg{flex:0 0 30px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.logo .ttl{display:flex;flex-direction:column;line-height:1.05;min-width:0}.logo .ttl small{font-size:11px;font-weight:700;opacity:.85;letter-spacing:.06em;text-transform:uppercase}
.logo .ttl b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:400px){.logo span{display:inline}.logo .ttl small{display:none}}
.pill{background:rgba(255,255,255,.92);color:#5a1b3b;padding:6px 10px;border-radius:999px;font-weight:800;box-shadow:inset 0 -1px 0 rgba(0,0,0,.06)}
[data-theme=dark] .pill{background:rgba(20,16,30,.55);color:#fff}
.pill.cash{color:var(--ok-d)}[data-theme=dark] .pill.cash{color:#6ee7a1}
.icon{width:44px;height:44px;background:rgba(255,255,255,.2);display:inline-flex;align-items:center;justify-content:center;padding:0;transition:transform .12s,background .2s}
.icon:active{transform:scale(.9);background:rgba(255,255,255,.35)}
.icon svg{width:22px;height:22px}
@media (max-width:400px){.icon{width:40px;height:40px}.hr{gap:4px}}
main{padding:12px 12px 104px}
nav{left:8px;right:8px;bottom:8px;border:0;border-radius:22px;background:var(--card);box-shadow:var(--sh3);padding:6px 4px calc(6px + env(safe-area-inset-bottom));max-width:704px;margin:0 auto}
nav button{min-height:52px;border-radius:16px;color:var(--muted);font-weight:700;font-size:11px;gap:2px;transition:color .2s,background .2s;margin:0 2px}
nav button svg{width:24px;height:24px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
nav button.on{background:linear-gradient(160deg,rgba(255,61,129,.14),rgba(124,77,255,.14));color:var(--brand-d)}
[data-theme=dark] nav button.on{color:#ff8ab4}
nav button.on svg{transform:translateY(-2px) scale(1.12)}
nav button.on::after{content:'';position:absolute;bottom:4px;width:18px;height:3px;border-radius:2px;background:var(--brand)}
.btn{min-height:44px;border-radius:14px;background:linear-gradient(180deg,#ff5a95,var(--brand));box-shadow:0 3px 0 var(--brand-d),0 6px 14px rgba(255,61,129,.25);letter-spacing:.01em;transition:transform .1s,box-shadow .1s,filter .2s}
.btn:active{transform:translateY(2px) scale(.98);box-shadow:0 1px 0 var(--brand-d),0 2px 6px rgba(255,61,129,.2)}
.btn.alt{background:linear-gradient(180deg,#6b6684,#545068);box-shadow:0 3px 0 #38354a,0 6px 12px rgba(40,30,70,.18)}
.btn.green{background:linear-gradient(180deg,#22c06a,var(--ok));box-shadow:0 3px 0 var(--ok-d),0 6px 14px rgba(18,161,80,.25)}
.btn:focus-visible,nav button:focus-visible,.chip:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}
.card{background:var(--card);border-radius:var(--r-l);box-shadow:var(--sh1);border:1px solid var(--line);padding:14px}
.small{color:var(--muted);font-size:var(--f-xs)}
.lbl{font-size:var(--f-l);font-weight:900;letter-spacing:-.01em;margin:16px 2px 8px;display:flex;align-items:center;gap:6px}
.grid{gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px 8px 10px;box-shadow:var(--sh1);transition:transform .15s,box-shadow .2s}
.item:active{transform:scale(.98)}
.item img{border-radius:16px;max-width:none;cursor:zoom-in}
.item .nm{font-weight:700;font-size:var(--f-s);line-height:1.25;margin:2px 2px 2px}
.item.eq{outline:none;box-shadow:0 0 0 3px var(--ok),var(--sh2)}
.rar{display:inline-block;font-size:10px;font-weight:900;letter-spacing:.08em;padding:2px 7px;border-radius:999px;margin-bottom:2px;color:#fff}
.rar-common{background:#8a8aa0}.rar-uncommon{background:#16a34a}.rar-rare{background:#2563eb}.rar-epic{background:#9333ea}.rar-legendary{background:linear-gradient(90deg,#f59e0b,#ef4444)}
.badge{border-radius:999px;padding:3px 8px;box-shadow:0 2px 6px rgba(0,0,0,.2);top:12px;left:12px}
.badge.sale{background:linear-gradient(90deg,#ff1744,#ff6d00)}
.item .heart{width:36px;height:36px;top:10px;right:10px;background:rgba(255,255,255,.95)}
.pr{color:var(--ok-d);font-size:16px}[data-theme=dark] .pr{color:#6ee7a1}
.tabs button,.chip{min-height:40px;background:var(--chip);color:var(--ink);border:0;font-weight:700;padding:8px 14px}
.tabs button.on,.chip.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 3px 10px rgba(124,77,255,.3)}
input[type=text],input[type=search],input[type=number],textarea,select{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;min-height:44px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand2)}
.slot{border-bottom:1px solid var(--line);min-height:44px}
#toast{top:auto;bottom:96px;background:rgba(29,26,43,.94);border-radius:16px;padding:10px 16px;box-shadow:var(--sh3);font-weight:700;transform:translateX(-50%) translateY(16px) scale(.96);transition:opacity .25s,transform .3s cubic-bezier(.3,1.5,.5,1)}
#toast.show{transform:translateX(-50%) translateY(0) scale(1)}
#sheet{background:rgba(18,12,30,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fadeIn .2s}
.sheetbox{background:var(--card);color:var(--ink);border-radius:26px 26px 0 0;animation:slideUp .32s cubic-bezier(.2,1.2,.4,1);box-shadow:var(--sh3)}
.sheetbox::before{content:'';display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 10px}
.sheetbox .x{background:var(--chip);color:var(--ink);width:44px;height:44px}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}}
#view.enter{animation:pageIn .28s cubic-bezier(.2,.9,.3,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#overlay .card{border:0;box-shadow:var(--sh3),0 0 0 3px var(--brand)}
.store{border-radius:var(--r-l)}
/* ---- mall concourse ---- */
.concourse{position:relative;border-radius:26px;padding:56px 10px 18px;background:
 linear-gradient(180deg,#bfe3ff 0,#e7f3ff 46px,transparent 46px),
 repeating-linear-gradient(90deg,rgba(255,255,255,.0) 0 58px,rgba(255,255,255,.55) 58px 62px),
 linear-gradient(180deg,#f3ede6 46px,#e6dccf 100%);box-shadow:var(--sh2);overflow:hidden;margin-bottom:12px}
[data-theme=dark] .concourse{background:linear-gradient(180deg,#1b2a44 0,#24304a 46px,transparent 46px),linear-gradient(180deg,#2a2536 46px,#1f1b2b 100%)}
.concourse::before{content:'';position:absolute;left:0;right:0;top:0;height:46px;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.7) 46px 50px);opacity:.6}
.concourse .ctitle{position:absolute;top:8px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;font-weight:900;color:#2b2a40;font-size:15px}
[data-theme=dark] .concourse .ctitle{color:#e9e6f7}
.fronts{display:grid;grid-template-columns:1fr 1fr;gap:14px 10px;position:relative}
.front{position:relative;border-radius:16px 16px 6px 6px;background:var(--sc);box-shadow:0 8px 16px rgba(30,20,50,.22);cursor:pointer;overflow:hidden;transition:transform .15s;min-height:168px;display:flex;flex-direction:column;color:#fff}
.front:active{transform:scale(.97)}
.front .awn{height:20px;background:repeating-linear-gradient(90deg,var(--sc) 0 14px,#fff 14px 28px);border-bottom:3px solid rgba(0,0,0,.18);clip-path:polygon(0 0,100% 0,100% 70%,96% 100%,89% 70%,82% 100%,75% 70%,68% 100%,61% 70%,54% 100%,47% 70%,40% 100%,33% 70%,26% 100%,19% 70%,12% 100%,5% 70%,0 100%)}
.front .sign{margin:8px 8px 0;padding:7px 4px;border-radius:10px;background:rgba(0,0,0,.28);text-align:center;font-size:14px;font-weight:900;line-height:1.05;text-shadow:0 1px 0 rgba(0,0,0,.4);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.front .win{flex:1;margin:8px 10px 0;border-radius:10px 10px 0 0;background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,.15) 45%,rgba(255,255,255,.3));display:flex;align-items:center;justify-content:center;font-size:40px;position:relative;min-height:66px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.front .win::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.5) 38%,transparent 46%)}
.front .tag{font-size:11px;padding:6px 8px 8px;background:rgba(0,0,0,.22);line-height:1.2;min-height:34px}
.front .flag{position:absolute;top:5px;right:5px;font-size:10px;font-weight:900;padding:2px 7px;border-radius:999px;background:linear-gradient(90deg,#7b1fa2,#d4af37);z-index:2}
.front.banned{filter:grayscale(.9) brightness(.8)}.front.banned .flag{background:#e11d48}
.front.alley{--sc:#263238}
.closed-row{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 2px}
.closed-row span{flex:0 0 auto;font-size:12px;font-weight:700;padding:6px 10px;border-radius:10px;background:repeating-linear-gradient(0deg,#cfd2da 0 5px,#b9bdc8 5px 7px);color:#3d4152}
/* ---- branded store hero ---- */
.hero{position:relative;border-radius:24px;padding:18px 16px 16px;color:#fff;margin-bottom:10px;overflow:hidden;background:var(--sc);box-shadow:var(--sh2)}
.hero::before{content:'';position:absolute;inset:0;background:var(--pat,none);opacity:.18}
.hero::after{content:'';position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .hl{position:relative;z-index:1;display:flex;align-items:center;gap:12px}
.hero .em{font-size:40px;width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.hero h2{margin:0;font-size:26px;line-height:1}.hero p{margin:4px 0 0;opacity:.92;font-size:13px}
.subbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.subbar .btn{min-height:40px;padding:8px 12px}
/* ---- avatar ---- */
.avwrap{display:flex;justify-content:center}

/* ======================= DAYS / ROTATION / DEALS ======================= */
function checkDay(){const g=gnow(),n=Math.floor((g-S.dayAt)/DAY_MS);if(n>0){if(n>3){S.dayAt=g}else S.dayAt+=n*DAY_MS;for(let i=0;i<Math.min(n,3);i++){S.day++;onNewDay()}save();return true}return false}
function nextDay(){S.day++;S.dayAt=gnow();onNewDay();save()}
function timeLeft(){const s=Math.max(0,Math.ceil((DAY_MS-(gnow()-S.dayAt))/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function openStores(){
  const POOL=STORES.filter(s=>!s.park&&!s.drop),open=shuffle(POOL,rng(S.day*7919+3)).slice(0,OPEN_COUNT);
  if(!open.some(s=>s.tier[1]<=150)){open[OPEN_COUNT-1]=shuffle(POOL.filter(s=>s.tier[1]<=150),rng(S.day+1))[0]}
  return open;
}
let DEAL_CACHE={day:-1,list:[]};
function deals(){if(DEAL_CACHE.day!==S.day){const r=rng(S.day*104729+17);DEAL_CACHE={day:S.day,list:shuffle(ITEMS.filter(i=>!i.rare&&MALL_STORE[i.store]),r).slice(0,6).map(i=>({id:i.id,off:[20,30,40,50,60][Math.floor(r()*5)]}))}}return DEAL_CACHE.list}
function dealOf(id){const d=deals().filter(x=>x.id===id)[0];return d?d.off:0}
function offOf(it){return Math.max(dealOf(it.id),eventOff(it),typeof weeklyOff==='function'?weeklyOff(it):0)}
function priceOf(it){const off=offOf(it);return off?Math.max(1,Math.round(it.price*(100-off)/100)):it.price}
function stockLeft(it){return it.rare?Math.max(0,it.stock-(S.stock[it.id]||0)):Infinity}

function poly(x,p){x.beginPath();x.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)x.lineTo(p[i],p[i+1]);x.closePath()}
function line(x,a,b,c,d){x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke()}
function lum(h){const n=parseInt(h.slice(1),16);return((n>>16&255)*.299+(n>>8&255)*.587+(n&255)*.114)/255}
function tint(h,f){const n=parseInt(h.slice(1),16);const c=v=>Math.max(0,Math.min(255,Math.round(v*f)));return'rgb('+c(n>>16&255)+','+c(n>>8&255)+','+c(n&255)+')'}
const PAT={};

  if(!PAT[k]){const c=document.createElement('canvas');c.width=c.height=12;const g=c.getContext('2d');g.fillStyle=it.color;g.fillRect(0,0,12,12);
    g.fillStyle=lum(it.color)>.6?'rgba(0,0,0,.3)':'rgba(255,255,255,.6)';
    if(it.pattern==='stripes')g.fillRect(0,0,12,4);
    else if(it.pattern==='dots'){circ(g,3,3,1.8);g.fill();circ(g,9,9,1.8);g.fill()}
    else if(it.pattern==='checks'){g.fillRect(0,0,6,6);g.fillRect(6,6,6,6)}

/* ---------- money: Mall Rat Card + Pay in 4 ---------- */
const cardLimit=()=>Math.round(Math.min(10000,500+100*S.shifts)*(typeof creditMult==='function'?creditMult():1));
function payWith(m,amt,label){
  if(m==='cash'){if(S.cash<amt)return false;S.cash-=amt}
  else if(m==='card'){if(S.card.bal+amt>cardLimit())return false;S.card.bal+=amt}
  else{const part=Math.ceil(amt/4);if(S.cash<part)return false;S.cash-=part;S.bnpl.push({label:label,amt:part,left:3})}
  S.spent+=amt;bumpCash();if(S.card.bal>cardLimit()*.6)setTimeout(()=>toast('💳 Your card is getting heavy. Future-you just sighed audibly.'),1900);return true}
function openPay(title,amt,done,extra){

   '<button class="btn green big" data-m="cash" '+(S.cash>=amt?'':'disabled')+'>💵 Cash (you have '+money(S.cash)+')</button>'+
   '<button class="btn big" data-m="card" '+(S.card.bal+amt<=lim?'':'disabled')+'>💳 Mall Rat Card · '+money(lim-S.card.bal)+' left · 3%/day</button>'+
   '<button class="btn alt big" data-m="bnpl" '+(S.cash>=part?'':'disabled')+'>🐢 Pay in 4: '+money(part)+' now + 3 daily</button>'+
   '<p class="small">Credit is fun until it isn\'t. Card interest compounds every in-game day.</p>');
  onAll($('#sheet'),'[data-m]',b=>{if(payWith(b.dataset.m,amt,title)){closeSheet();done(b.dataset.m)}else{sfx('bad');toast('Payment declined 😬')}})}

/* ---------- Fleabay ---------- */
const inc=a=>Math.max(1,Math.round(a.bid*.06));
const nextBid=a=>a.high?a.bid+inc(a):a.bid;
function fmtLeft(ms){const s=Math.max(0,Math.ceil(ms/1000));return s?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):'ended'}
function fleaRefill(){const now=gnow(),pool=ITEMS.filter(i=>MALL_STORE[i.store]&&!i.rare);
  while(S.flea.filter(a=>!a.done&&a.seller!=='you').length<5){const it=pick(pool),st=Math.max(1,Math.round(it.price*.15));
    S.flea.push({aid:S.oid++,id:it.id,seller:pick(NPC),bid:st,high:null,end:now+(60+rand(180))*1000,npcMax:Math.round(it.price*(.45+Math.random()*.5)),escrow:0,done:false,bids:0})}}
function playerBid(a){if(a.done||a.high==='you'||a.seller==='you')return;const amt=nextBid(a);
  if(S.cash<amt){toast('You need '+money(amt)+' cash to back that bid');sfx('bad');return}
  S.cash-=amt;a.bid=amt;a.high='you';a.escrow=amt;a.bids++;if(a.end-gnow()<10000)a.end=gnow()+10000;sfx('coin');toast('🙌 You\'re the high bidder!');save();rerender()}
function npcBid(a){const amt=nextBid(a);if(amt>a.npcMax)return false;
  if(a.high==='you'){S.cash+=a.escrow;a.escrow=0;notify('😤 Outbid on '+ITEM[a.id].name+' (now '+money(amt)+')');toast('😤 Outbid on '+ITEM[a.id].name+'!');sfx('bad')}
  a.bid=amt;a.high=pick(NPC.filter(n=>n!==a.seller&&n!==a.high));a.bids++;return true}

  for(let i=0;i<6;i++){const it=pick(pool),sl=pick(FB_SELLERS),ask=nicePrice(it.price*(.35+Math.random()*.35));
    S.fb.list.push({lid:S.oid++,id:it.id,seller:sl[0],face:sl[1],ask:ask,floor:Math.round(ask*(.6+Math.random()*.25)),scam:!!KO_OF[it.id]&&Math.random()<.3,status:'open',chat:[],counter:0,tries:0,asked:false})}}
function openFb(l){const it=ITEM[l.id];
  const chat=l.chat.map(m=>'<div class="bub '+(m[0]==='me'?'me':'')+'">'+esc(m[1])+'</div>').join('');
  sheet('<div class="row" style="align-items:flex-start"><img src="'+thumb(it)+'" style="width:76px;border-radius:10px"><div style="flex:1"><b>'+esc(it.name)+'</b><div class="small">'+l.face+' '+esc(l.seller)+' · retail '+money(it.price)+'</div><div class="pr">Asking '+money(l.ask)+'</div></div></div>'+
   '<div class="chat" id="chat">'+(chat||'<div class="small center">Say hi to the seller…</div>')+'</div>'+
   (l.status==='ghosted'?'<p class="center">👻 '+esc(l.seller)+' has left the chat. Forever.</p>':l.status==='sold'?'<p class="center">✅ You bought this.</p>':
   (!l.asked?'<button class="btn big" id="ask">👋 "Hi, is this still available?"</button>':
    '<div class="row"><input type="number" id="offer" inputmode="numeric" value="'+Math.round((l.counter||l.ask)*.75)+'" style="flex:1;width:auto"><button class="btn" id="off">Offer</button></div>'+
    (l.counter?'<button class="btn green big" id="acc">🤝 Accept '+money(l.counter)+'</button>':'')+'<button class="btn alt big" id="full">Pay asking price '+money(l.ask)+'</button>')));
  const ch=$('#chat');ch.scrollTop=ch.scrollHeight;
  const say=(w,t)=>l.chat.push([w,t]),ghost=()=>{l.status='ghosted';sfx('bad')};
  if($('#ask'))$('#ask').onclick=()=>{l.asked=true;say('me','Hi, is this still available?');
    if(Math.random()<.1){say('them','…');ghost()}else say('them',pick(['Yes!!! still available','yes. no lowballs I know what I have','Yeah but 3 other people want it','who is this','Yes 😊 porch pickup only, 2am','Available. Cash, Venmoo, or interesting rocks.']));save();openFb(l)};
  if($('#off'))$('#off').onclick=()=>{const v=parseInt($('#offer').value,10);if(!(v>0))return;l.tries++;say('me','Would you take '+money(v)+'?');
    if(v>=l.ask){l.counter=l.ask;say('them','Sure lol. '+money(l.ask)+' it is')}
    else if(v>=l.floor){l.counter=v;say('them',pick(['Ugh fine. '+money(v)+'. Come get it','Deal 🤝 '+money(v),'ok '+money(v)+' but you have to compliment my dog']))}
    else if(v>=l.floor*.75&&l.tries<5){l.counter=Math.max(l.floor,Math.round((v+l.ask)/2));say('them','Best I can do is '+money(l.counter))}
    else if(Math.random()<.35||l.tries>=5){say('them',pick(['lol','Seen ✓','🙄','Blocked.']));ghost()}
    else{l.counter=l.ask;say('them','lol no. '+money(l.ask)+' firm')}
    save();openFb(l)};
  const buyAt=p=>openPay('Facenook: '+it.name,p,()=>{l.status='sold';S.stats3.haggled++;maybeContact();
    if(l.scam){const ko=ITEM[KO_OF[l.id]];S.owned[ko.id]=(S.owned[ko.id]||0)+1;S.stats3.scammed++;notify('🤡 Facenook: your "'+it.name+'" is actually a '+ko.name+'. Worth '+money(ko.price)+'.');toast('🤡 Plot twist: it\'s a '+ko.name+' (worth '+money(ko.price)+')');sfx('bad')}
    else{S.owned[it.id]=(S.owned[it.id]||0)+1;toast('🎉 Got it for '+money(p)+'! (retail '+money(it.price)+')');sfx('buy')}save();rerender()});
  if($('#acc'))$('#acc').onclick=()=>buyAt(l.counter);if($('#full'))$('#full').onclick=()=>buyAt(l.ask);
}

/* ============================== CRIME & CONSEQUENCES (v4) ==============================
   Shoplifting stealth minigame, Heat, court (fine or community service), store bans,
   Back Alley counterfeits, counterfeit-selling busts, police raids. Satire: crime should
   never beat a burger shift on average. Test hooks: window.__stealForce / __bustForce / __raidForce. */
let stealIv=null;
const R=()=>S.rap;
const LUX=s=>s&&s.tier[1]>=2000;
const COOLDOWN=7;
function stealWait(sid){const l=S.rap.lastSteal[sid];return l===undefined?0:Math.max(0,l+COOLDOWN-S.day)}

function hotClamp(id){const h=S.rap.hot;if(h[id]>(S.owned[id]||0)){h[id]=S.owned[id]||0;if(!h[id])delete h[id]}}
function hotBust(it,claimed,where){let bust=Math.random()<(.35+S.rap.heat/200);if(window.__bustForce!==undefined)bust=window.__bustForce;
  if(!bust){addHeat(5);return false}S.rap.busted++;setTimeout(()=>courtCase({what:'Fencing stolen '+it.name+' on '+where,base:Math.max(claimed,it.price),heat:25,confiscated:true,emoji:'🧾'}),50);return true}
const isBanned=id=>!!(S.rap.bans[id]&&S.day<=S.rap.bans[id]);
function heatColor(h){return h>=60?'#d32f2f':h>=30?'#f57c00':h>0?'#fbc02d':'#43a047'}
function heatPill(){const h=Math.round(R().heat);return'<span class="heat" style="background:'+heatColor(h)+'">🔥 Heat '+h+'</span> '}

function storeOf(it){return STORES.filter(s=>s.id===it.store)[0]}
function security(it){const s=storeOf(it),hi=s?s.tier[1]:100;const a=Math.min(1,Math.log(hi)/Math.log(30000)),b=Math.min(1,Math.log(Math.max(1,priceOf(it)))/Math.log(50000));return Math.max(.05,Math.min(1,a*.6+b*.4))}

/* ---------- court ---------- */
function courtCase(c){
  const r=R(),prior=r.offenses;r.offenses++;r.caught++;addHeat(c.heat||15);
  const fee=100+100*prior,fine=Math.max(30,Math.round(c.base*(3+prior)))+fee,petty=fine<=600,cs=Math.min(15,Math.max(4+2*prior,Math.ceil(fine/60))),repeat=prior>=2;
  const st=c.store&&storeOf({store:c.store});
  let ban='';if(c.store){r.storeOff[c.store]=(r.storeOff[c.store]||0)+1;const n=r.storeOff[c.store],len=LUX(st)?7*n:n>=2?5*(n-1):0;if(len){r.bans[c.store]=S.day+len;ban='<p>🚫 <b>Banned from '+esc(storeOf({store:c.store}).name)+' until Day '+r.bans[c.store]+'.</b> Your photo is now on the wall behind the register.</p>'}}
  const entry={day:S.day,what:c.what,pen:''};r.record.unshift(entry);if(r.record.length>30)r.record.length=30;
  // repeat offenders: fine is charged automatically AND community service. Non-petty: fine only (no CS option). Petty first/second: choose.
  const charge=()=>{if(S.cash>=fine)S.cash-=fine;else S.card.bal+=fine;r.finesPaid+=fine};
  let mode;if(repeat){charge();r.cs+=cs;mode='both';entry.pen='Fine '+money(fine)+' + '+cs+' shifts CS'}
  else if(!petty){charge();mode='fine';entry.pen='Fine '+money(fine)}
  else{r.cs+=cs;mode='choose';entry.pen=cs+' shifts community service'}
  notify('🚨 '+c.what+': '+entry.pen);sfx('bad');save();hud();setTimeout(()=>avMood('wow',3000),60);
  sheet('<h3>🚨 Busted!</h3><div style="font-size:44px;text-align:center">👮‍♀️'+(c.emoji||'🛍️')+'</div><p>'+esc(c.what)+'.'+(c.confiscated?' The item has been confiscated.':'')+'</p>'+
    '<div class="small">Offense #'+r.offenses+' · Heat '+Math.round(r.heat)+'/100</div>'+ban+
    '<div class="small">Fine = '+(3+prior)+'× item value + '+money(fee)+' court fee</div>'+
    (mode==='both'?'<p>⚖️ Judge Judgy has seen enough of you. Fine of <b>'+money(fine)+'</b> (charged'+(S.card.bal>0?', some to your card':'')+') <b>AND '+cs+' shifts of community service</b>. Paid jobs are blocked until it\'s done.</p><button class="btn alt big" id="docs">😔 Yes, Your Honor</button>':
     mode==='fine'?'<p>⚖️ That\'s no petty theft. Fine of <b>'+money(fine)+'</b>, charged to your cash (or card, with interest). Community service isn\'t an option at this amount.</p><button class="btn alt big" id="docs">😔 Yes, Your Honor</button>':
     '<p>⚖️ Petty theft. Choose your penalty:</p><button class="btn big" id="payfine">💸 Pay a '+money(fine)+' fine</button><button class="btn alt big" id="docs">🧹 '+cs+' shifts of community service (unpaid, 15 pieces each, blocks paid jobs)</button>'));
  $('#docs').onclick=()=>{closeSheet();toast('🧹 Report to 💼 Work for community service');rerender()};
  if($('#payfine'))$('#payfine').onclick=()=>openPay('Court fine',fine,()=>{r.cs=Math.max(0,r.cs-cs);r.finesPaid+=fine;entry.pen='Fine '+money(fine);hud();toast('⚖️ Fine paid. Try to stay boring.');save();rerender()});
}

/* ---------- shoplifting stealth minigame ---------- */
function catchP(sec){return Math.min(.9,.25+.3*sec+R().heat/250)}
function stealAttempt(it){
  if(isBanned(it.store)){toast('🚫 You\'re banned here');return}
  if(!S.rap.optin)return;if(!canSteal(it.store)){toast('⏳ Security still remembers you. Try again in '+stealWait(it.store)+' days');return}
  S.rap.lastSteal[it.store]=S.day;save();
  const sec=security(it),half=.22+.5*sec,speed=1.3+2.4*sec,lvl=sec<.3?'low 😴':sec<.6?'medium 👀':'HIGH 🚨';
  sheet('<h3>🤏 Five-finger discount?</h3><div class="small">'+esc(it.name)+' · security <b>'+lvl+'</b>. Tap GRAB while the camera looks away. Even then, there\'s a <b>'+Math.round(catchP(sec)*100)+'%</b> chance someone sees you. Caught = '+(3+R().offenses)+'× fine + court fee. One attempt per store per week. '+heatPill()+'</div><canvas id="stc"></canvas><div class="bar"><div id="stt"></div></div>'+
    '<button class="btn big" id="grab" style="background:#7b1fa2;box-shadow:0 2px 0 #4a148c">🤏 GRAB</button><button class="btn alt big" id="walk">😇 Never mind (buy it like a normal person)</button>');
  const W=Math.min(window.innerWidth-40,420),H=170,x=setupCanvas($('#stc'),W,H),img=new Image();img.src=thumb(it);
  const t0=gnow(),LIMIT=7000;let ang=0,done=false;
  function draw(){const t=(gnow()-t0)/1000;ang=Math.sin(t*speed)*1.15;const seen=Math.abs(ang)<half;
    x.fillStyle='#fff3e0';x.fillRect(0,0,W,H);x.fillStyle='#bcaaa4';x.fillRect(0,H-40,W,40);x.fillStyle='#8d6e63';x.fillRect(W/2-60,H-58,120,10);
    const cx=W/2,cy=14,len=H*1.4;x.fillStyle=seen?'rgba(244,67,54,.35)':'rgba(255,235,59,.3)';x.beginPath();x.moveTo(cx,cy);
    x.arc(cx,cy,len,Math.PI/2+ang-half,Math.PI/2+ang+half);x.closePath();x.fill();
    x.font='26px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('📹',cx,cy);
    if(img.complete)x.drawImage(img,cx-30,H-110,60,60);x.font='bold 13px sans-serif';x.fillStyle=seen?'#d32f2f':'#2e7d32';x.fillText(seen?'👁️ WATCHING':'✅ looking away',cx,H-18);
    const p=1-(gnow()-t0)/LIMIT;setBar($('#stt'),p);
    if(p<=0&&!done){done=true;clearInterval(stealIv);closeSheet();toast('😅 You lost your nerve. Probably for the best.')}}
  clearInterval(stealIv);stealIv=setInterval(draw,30);draw();
  $('#walk').onclick=()=>{closeSheet();buy(it)};
  $('#grab').onclick=()=>{if(done)return;done=true;clearInterval(stealIv);const seen=Math.abs(ang)<half;
    let caught=Math.random()<(seen?.95:catchP(sec));
    if(window.__stealForce)caught=window.__stealForce==='caught';
    closeSheet();
    if(!caught){S.owned[it.id]=(S.owned[it.id]||0)+1;R().hot[it.id]=(R().hot[it.id]||0)+1;if(it.rare)S.stock[it.id]=(S.stock[it.id]||0)+1;R().stolen++;const h=Math.round(6+12*sec);addHeat(h);
      sfx('buy');toast('😈 Got away with it… for now. Heat +'+h);save();rerender()}
    else courtCase({what:'Caught shoplifting '+it.name+' from '+storeOf(it).name,base:priceOf(it),store:it.store,heat:Math.round(15+20*sec),confiscated:true,emoji:'🤏'})};
}

function extPart(k){const id=S.home.ext[k];const it=id&&ITEM[id];return it?{color:it.color,style:it.style}:EXT_DEF[k]}

/* ============================== v7 GAME CLOCK ==============================
   S.gt = accumulated game time (ms, epoch-like so old timestamps stay valid). It only advances while the page is visible,
   via a 1s heartbeat; any gap > 15s between beats (sleep/background) is ignored. All day/auction timers use gnow(). */
const CLOCK={last:Date.now(),on:!document.hidden,awayShown:false};
const BEAT_MAX=15000,AWAY_MIN=30*60000,AWAY_CAP=24*3600000;
function gnow(){if(!S.gt)S.gt=Date.now();return S.gt+(CLOCK.on?Math.max(0,Math.min(Date.now()-CLOCK.last,BEAT_MAX)):0)}
function clockTick(){const n=Date.now(),d=n-CLOCK.last;if(CLOCK.on&&S.gt&&d>0&&d<=BEAT_MAX)S.gt+=d;CLOCK.last=n}
function clockPause(){if(!CLOCK.on)return;clockTick();CLOCK.on=false;if(S&&S.char)try{save()}catch(e){}}
function clockResume(){if(CLOCK.on)return;S.awayFrom=S.savedAt;CLOCK.last=Date.now();CLOCK.on=true;welcomeBack()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)clockPause();else clockResume()});
window.addEventListener('pagehide',clockPause);
window.addEventListener('pageshow',()=>{if(!document.hidden)clockResume()});

function homeScore(){return Math.min(100,Math.round(decorScore()*.6+curbAppeal()*.4)+(typeof petBonus==='function'?petBonus():0)+(typeof apt==='function'&&S.apt?apt().home:0))}
function nbScore(n,w){const r=rng(hash(n.k)+w*7919)();return Math.min(97,Math.round(n.base+n.grow*Math.min(w,12)+r*18))}
function rateLine(n,sc){const hi=sc>=70,mid=sc>=40;return n.k==='karen'?(hi?'Okay fine. It\'s giving penthouse. I hate you.':mid?'Cute! In a "rental" way.':'Do you… live here? Like on purpose?'):
  n.k==='chad'?(hi?'BRO. This place has GAINS.':mid?'Solid. Needs a squat rack in the living room.':'Where is the TV, bro. Where is it.'):
  n.k==='gretchen'?(hi?'Oh sweetie, it\'s lovely! Here, a cookie.':mid?'Very nice, dear. Water your ferns.':'It\'s… cozy! I\'ll bring a quilt.'):
  n.k==='mike'?(hi?'Too much stuff. And yet… I feel peace.':mid?'You could lose 40% of this and be free.':'Empty. Perfect. I cried.'):
  (hi?'Your yard energy is IMMACULATE. The gnomes approve.':mid?'Decent. Needs ~200 more gnomes.':'No gnomes? Bold. Wrong, but bold.')}

   '<div class="lbl">🚪 Visit</div>'+NEIGHBORS.map(n=>'<div class="slot"><span>'+n.face+' '+esc(n.name)+'</span><button class="btn alt" data-nb="'+n.k+'">Visit</button></div>').join(''));

  sheet('<h3>'+n.face+' '+esc(n.name)+'</h3><canvas id="nbc"></canvas><div class="card"><b>Their place: '+nbScore(n,w)+'/100</b><div class="small">"'+esc(n.line)+'"</div></div><div class="card"><b>They rate YOUR place: '+me+'/100</b><div class="small">'+n.face+' "'+esc(rateLine(n,me))+'"</div><div class="small">Interior '+decorScore()+' · curb appeal '+curbAppeal()+'</div></div><button class="btn alt big" id="nbback">← Back to the block</button>');
  const c=Math.floor(Math.min(innerWidth-48,420)/COLS),cv=$('#nbc'),x=setupCanvas(cv,c*COLS,c*(HROWS+2));
  const sv=S.home.ext;const r=rng(hash(n.k)+w);const fake={};Object.keys(EXT_DEF).forEach(k=>{const pool=ITEMS.filter(i=>i.ext===k);if(pool.length&&r()<.85)fake[k]=pool[Math.floor(r()*pool.length)].id});
  try{S.home.ext=fake;const g=x.createLinearGradient(0,0,0,c*(HROWS+2));g.addColorStop(0,'#90caf9');g.addColorStop(1,'#e3f2fd');x.fillStyle=g;x.fillRect(0,0,c*COLS,c*(HROWS+2));x.fillStyle='#8bc34a';x.fillRect(0,c*HROWS,c*COLS,c*2);x.save();x.translate(0,c*.4);drawHouse(x,c);x.restore();
    x.font=Math.round(c*.8)+'px sans-serif';for(let i=0;i<(n.k==='gary'?9:2);i++)x.fillText(n.k==='gary'?'🧙':'🌳',(r()*(COLS-1))*c,c*(HROWS+1.6));}finally{S.home.ext=sv}
  $('#nbback').onclick=neighborSheet}

const TICK_MS=20000;
const TICKERS=[{k:'CLMZ',name:'Clamazon',p0:120,vol:.02,dr:.0007,col:'#ff9900'},{k:'GOOCH',name:'Goochie Group',p0:340,vol:.025,dr:.0005,col:'#2e7d32'},
 {k:'WALY',name:'Wally\'s Mart',p0:45,vol:.012,dr:.0004,col:'#1565c0'},{k:'FRAUD',name:'Frauda SpA',p0:80,vol:.035,dr:.0002,col:'#6a1b9a'},{k:'DOGE',name:'Doge-ish Coin',p0:.42,vol:.08,dr:0,col:'#f9a825',coin:1}];
const HEADLINES={up:['{n} CEO spotted smiling. Investors lose their minds.','{n} announces "AI-powered shopping bag". Stock moons.','Analyst: "{n}? More like {n} to the moon."'],
 dn:['{n} recalls 10 million left shoes.','{n} CEO says "vibes are down this quarter".','Rumor: {n} warehouse cat quits. Panic.']};
function mkt(){if(!S.mkt||!S.mkt.px){S.mkt={t:Math.floor(gnow()/TICK_MS),px:{},hist:{},hold:{}};TICKERS.forEach(t=>{S.mkt.px[t.k]=t.p0;S.mkt.hist[t.k]=[t.p0]})}TICKERS.forEach(t=>{if(!S.mkt.px[t.k]){S.mkt.px[t.k]=t.p0;S.mkt.hist[t.k]=[t.p0]}});return S.mkt}
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function mktStep(news){const m=mkt();TICKERS.forEach(t=>{let r=t.dr+t.vol*gauss();if(t.coin&&Math.random()<.03){r=Math.random()<.55?.4:-.35;if(news)notify('🐕 '+(r>0?'A billionaire tweeted a dog emoji. Doge-ish Coin +40%!':'Doge-ish Coin dev "went for milk". -35%'))}
   else if(Math.random()<.01){r+=Math.random()<.5?.12:-.12;if(news)notify('📰 '+pick(HEADLINES[r>0?'up':'dn']).replace(/\{n\}/g,t.name))}
   const px=Math.max(t.coin?.01:1,m.px[t.k]*Math.exp(r));m.px[t.k]=t.coin?Math.round(px*1000)/1000:Math.round(px*100)/100;const h=m.hist[t.k];h.push(m.px[t.k]);if(h.length>80)h.splice(0,h.length-80)})}
function mktTick(){const m=mkt(),now=Math.floor(gnow()/TICK_MS);if(now<=m.t)return false;const n=Math.min(30,now-m.t);m.t=now;for(let i=0;i<n;i++)mktStep(i===n-1);return true}
const fmtPx=(t,p)=>t.coin?'$'+p.toFixed(3):'$'+p.toFixed(2);
function trade(k,q){const m=mkt(),t=TICKERS.filter(x=>x.k===k)[0],p=m.px[k],h=m.hold[k]||(m.hold[k]={n:0,cost:0});
  if(q>0){const fee=t.coin?Math.max(1,p*q*.02):1,cost=p*q+fee;if(S.cash<cost){toast('Not enough cash');sfx('bad');return}S.cash-=cost;h.n+=q;h.cost+=cost;S.stats8.trades++;sfx('coin');toast('📈 Bought '+q+' '+k)}
  else{q=Math.min(-q,h.n);if(!q)return;const fee=t.coin?Math.max(1,p*q*.02):1,got=Math.max(0,p*q-fee),basis=h.cost*q/h.n;h.n-=q;h.cost-=basis;S.cash+=got;const pl=got-basis;S.stats8.stockProfit+=pl;S.stats8.trades++;if(pl>0)S.stats8.stonkWin=1;
    sfx(pl>=0?'level':'bad');toast((pl>=0?'💰 Sold for a '+money(pl)+' profit':'📉 Sold at a '+money(-pl)+' loss')+'. Fees: '+money(fee));if(!h.n)delete m.hold[k]}
  S.cash=Math.round(S.cash*100)/100;save();rerender()}
function spark(cv,h,col){const W=cv.width,H=cv.height,x=cv.getContext('2d');x.clearRect(0,0,W,H);const lo=Math.min.apply(0,h),hi=Math.max.apply(0,h),sp=hi-lo||1;x.strokeStyle=col;x.lineWidth=2*(window.devicePixelRatio||1);x.beginPath();h.forEach((v,i)=>{const X=i/(Math.max(1,h.length-1))*W,Y=H-((v-lo)/sp)*(H-4)-2;i?x.lineTo(X,Y):x.moveTo(X,Y)});x.stroke()}
function renderStonks(v){mktTick();const m=mkt();const port=Object.keys(m.hold).reduce((a,k)=>a+m.hold[k].n*m.px[k],0);

    v.appendChild(d);const cv=d.querySelector('canvas');cv.width=(innerWidth-60)*(window.devicePixelRatio||1);cv.height=44*(window.devicePixelRatio||1);spark(cv,h,t.col)});

const HUSTLE_PLAT={flea:{name:'Fleabay',fee:.08,em:'🔨'},fb:{name:'Facenook',fee:0,em:'🏷️'}};
const BUYERS=['xX_BidLord_Xx','GrandmaGretchen','CryptoChad','ThriftQueen99','Kevin','DealGoblin','auntie_m','SirBidsALot','FrugalFrank','Brenda (moving tmrw!!)','Uncle Ron','definitely_not_a_bot'];
const LOWBALL=['is this still available? would u take {o}','{o} cash and a sandwich. final offer.','i can do {o}. my cat is sick (i don\'t have a cat)','lowest u can go? {o}? ok {o}.','{o}. take it or leave it. im a business man.'];

function demand(it){let d=1;if(it.rare)d*=2.5;if(it.drop)d*=3;if(typeof openStores==='function'&&openStores().every(s=>s.id!==it.store))d*=1.3;return d}

function hustleTick(){const now=gnow();let ch=false;S.hustle.forEach(l=>{if(l.sold)return;let k=0;while(now-l.last>=15000&&k<20){l.last+=15000;k++;const r=Math.random(),it=ITEM[l.id],who=pick(BUYERS);
    if(r<sellChance(l)){const fee=HUSTLE_PLAT[l.plat].fee,net=Math.round(l.ask*(1-fee));l.sold=1;S.cash+=net;S.stats8.resold++;S.stats8.resProfit+=Math.max(0,net-it.price);l.msgs.push({t:'💸 '+who+': '+pick(BUYMSG)+' (+'+money(net)+(fee?' after '+Math.round(fee*100)+'% fee':'')+')'});notify('💸 Sold '+it.name+' on '+HUSTLE_PLAT[l.plat].name+' for '+money(net)+'!');ch=true;break}

      else if(roll<.8)l.msgs.push({t:who+': '+pick(WEIRD)});else l.msgs.push({t:who+': '+pick(SCAMS).replace('{x}',money(l.ask*3)).replace('{o}',money(l.ask*2)),scam:1});ch=true}}
   if(l.msgs.length>8)l.msgs.splice(1,l.msgs.length-8)});
  S.hustle=S.hustle.filter(l=>!l.sold||now-l.last<120000);return ch}

const MZ={iv:null,step:0};
const MZ_CH=[[261.6,329.6,392,493.9],[220,261.6,329.6,392],[174.6,220,261.6,329.6],[196,246.9,293.7,349.2]];// Cmaj7 Am7 Fmaj7 G7: peak elevator
function mzNote(f,t,d,g,type){const o=AC.createOscillator(),gn=AC.createGain();o.type=type||'sine';o.frequency.value=f;gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(g,t+.03);gn.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+d+.05)}
function muzakStart(){if(MZ.iv||!S.muzak||S.muted||document.hidden)return;try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C()}if(AC.state==='suspended')AC.resume()}catch(e){return}
  MZ.iv=setInterval(()=>{if(!AC)return;const t=AC.currentTime+.05,bar=Math.floor(MZ.step/8)%4,ch=MZ_CH[bar],s=MZ.step%8;
    if(s===0)ch.forEach(f=>mzNote(f/2,t,1.9,.012,'triangle'));if(s%2===0)mzNote(ch[0]/4,t,.35,.03,'sine');
    if([0,3,5,6].indexOf(s)>=0)mzNote(ch[(s+MZ.step)%4]*2,t,.4,.016,'sine');MZ.step++},260)}
function muzakStop(){clearInterval(MZ.iv);MZ.iv=null}

const PW={iv:null,tx:null,ty:null,wait:0,moving:false,face:1,heart:0,last:0,petT:0};
function petLoop(draw,cv,c){if(PW.iv)clearInterval(PW.iv);PW.iv=null;if(!S.pet||S.pet.away)return;PW.last=gnow();
  cv.addEventListener('pointerdown',e=>{const p=S.pet;if(!p||p.away)return;const r=cv.getBoundingClientRect(),gx=(e.clientX-r.left)/c-.5,gy=(e.clientY-r.top)/c-.5;
    if(Math.abs(gx-p.wx)<.75&&gy>p.wy-1.1&&gy<p.wy+.7){e.stopImmediatePropagation();e.preventDefault();petReact()}},true);
  PW.iv=setInterval(()=>{if(!document.body.contains(cv)||!S.pet||S.pet.away){clearInterval(PW.iv);PW.iv=null;return}const now=gnow(),dt=Math.min(.25,(now-PW.last)/1000);PW.last=now;const p=S.pet;
    if(PW.tx==null||(!PW.moving&&now>PW.wait)){const near=Math.random()<.4;PW.tx=near?Math.max(0,Math.min(COLS-1,S.avatar.x+(Math.random()<.5?-1:1))):Math.random()*(COLS-1);PW.ty=near?S.avatar.y:WALL+Math.random()*(ROWS-1-WALL);PW.moving=true}
    let moved=false;if(PW.moving){const dx=PW.tx-p.wx,dy=PW.ty-p.wy,d=Math.hypot(dx,dy),sp=(p.k==='capy'?.6:p.k==='hamster'?1.6:1.1)*dt;if(d<=sp){p.wx=PW.tx;p.wy=PW.ty;PW.moving=false;PW.wait=now+1500+Math.random()*3000}else{p.wx+=dx/d*sp;p.wy+=dy/d*sp;if(Math.abs(dx)>.05)PW.face=dx<0?-1:1}moved=true}
    if(moved||PW.heart>now-100)draw()},90)}

  toast(['💕 '+p.name+' loves you (and your wallet)','✨ '+p.name+' did a little spin','🥺 '+p.name+' demands snacks','😌 '+p.name+' approves of the decor'][Math.floor(Math.random()*4)])}

/* Credit Karen + apartments */
const APTS=[{k:'basement',name:'Your Parents\' Basement',min:0,rent:0,dep:0,home:0,blurb:'Free rent. Mandatory family dinners.'},{k:'lofts',name:'Vape-Ex Lofts',min:650,rent:40,dep:200,home:5,blurb:'Exposed brick, exposed pipes, exposed neighbors.'},

const apt=()=>APTS.filter(a=>a.k===S.apt.k)[0]||APTS[0];
function creditTier(s){return s<580?['Poor','💀','#d32f2f']:s<670?['Fair','😬','#f57c00']:s<740?['Good','🙂','#7cb342']:s<800?['Very Good','😎','#2e7d32']:['Exceptional','🧐','#1565c0']}
function creditMult(){const s=S.credit?S.credit.score:650;return s<580?.6:s<670?1:s<740?1.25:s<800?1.5:2}
function credit(d,why){const c=S.credit;c.score=Math.max(300,Math.min(850,c.score+d));if(why)c.log.unshift({d:d,why:why,day:S.day});c.log.length=Math.min(c.log.length,12)}
function creditNewDay(){const c=S.credit,lim=cardLimit(),bal=S.card.bal,u=bal/lim;
  if(bal<=0)credit(c.lastBal>0?8:2,c.lastBal>0?'Paid card in full 👏':'No debt');else if(u>.9)credit(-12,'Card maxed out ('+Math.round(u*100)+'%)');else if(u>.6)credit(-6,'High utilization ('+Math.round(u*100)+'%)');else if(u<.3)credit(3,'Low utilization');else credit(-1,'Carrying a balance');
  if(c.bnplPaid){credit(2*c.bnplPaid,'Pay-in-4 paid on time');c.bnplPaid=0}
  const a=apt();if(a.rent){if(S.cash>=a.rent){S.cash-=a.rent;credit(1,'Rent on time')}else if(S.card.bal+a.rent<=lim){S.card.bal+=a.rent;credit(-8,'Rent put on card')}else{S.apt.miss++;credit(-25,'Missed rent');notify('🏠 Missed rent at '+a.name+'! Strike '+S.apt.miss+'/2.');
    if(S.apt.miss>=2){const i=APTS.indexOf(a);S.apt={k:APTS[Math.max(0,i-1)].k,miss:0};notify('📦 Evicted from '+a.name+'. Back to '+apt().name+'. Mom made lasagna.')}}}
  c.lastBal=S.card.bal;c.hist.push(c.score);if(c.hist.length>14)c.hist.shift();if(S.day%4===0)notify('💅 Credit Karen: your score is '+c.score+' ('+creditTier(c.score)[0]+'). '+(c.score>=740?'Fine. I\'m impressed. Don\'t tell anyone.':c.score<580?'I need to speak to your financial manager.':'Could be worse. Could be better. Mostly worse.'))}
function creditBlock(v){const c=S.credit,t=creditTier(c.score),a=apt();
  v.insertAdjacentHTML('beforeend','<div class="card" id="creditcard"><div class="row sp"><b>💅 Credit Karen</b><span class="small">limit ×'+creditMult()+'</span></div><div class="row" style="align-items:center;gap:12px"><div style="font-size:38px;font-weight:900;color:'+t[2]+'">'+c.score+'</div><div><b>'+t[1]+' '+t[0]+'</b><div class="small">300–850 · pay your card in full, keep it under 30%, don\'t bounce Pay-in-4.</div></div></div>'+
   '<canvas id="crsp" width="300" height="46" style="width:100%;height:46px"></canvas>'+(c.log.length?'<div class="small">'+c.log.slice(0,4).map(l=>(l.d>=0?'🟢 +':'🔴 ')+l.d+' '+esc(l.why)).join('<br>')+'</div>':'')+'</div>'+
   '<div class="card" id="aptcard"><b>🏢 Apartments</b><div class="small">You live at <b>'+esc(a.name)+'</b>'+(a.rent?' · rent '+money(a.rent)+'/day (auto-pay)':'')+'. Better address = higher home score with the neighbors.</div>'+
   APTS.map(q=>{const here=q.k===a.k,ok=c.score>=q.min;return'<div class="slot"><span><b>'+esc(q.name)+'</b><br><span class="small">'+esc(q.blurb)+'<br>Score '+q.min+'+ · rent '+money(q.rent)+'/day · deposit '+money(q.dep)+' · home +'+q.home+'</span></span>'+(here?'<button class="btn alt" disabled>Home</button>':'<button class="btn" data-apt="'+q.k+'" '+(ok||APTS.indexOf(q)<APTS.indexOf(a)?'':'disabled')+'>'+(ok||APTS.indexOf(q)<APTS.indexOf(a)?'Move':'🔒 '+q.min)+'</button>')+'</div>'}).join('')+'</div>');
  const cv=$('#crsp');if(cv){const x=cv.getContext('2d'),h=c.hist.length>1?c.hist:[c.score,c.score];x.clearRect(0,0,300,46);x.strokeStyle=t[2];x.lineWidth=2.5;x.beginPath();h.forEach((s,i)=>{const X=i/(h.length-1)*296+2,Y=44-(s-300)/550*42;i?x.lineTo(X,Y):x.moveTo(X,Y)});x.stroke()}
  onAll(v,'[data-apt]',b=>{const q=APTS.filter(z=>z.k===b.dataset.apt)[0];if(APTS.indexOf(q)>APTS.indexOf(apt())){if(S.credit.score<q.min)return;if(S.cash<q.dep){toast('Need '+money(q.dep)+' cash for the deposit');sfx('bad');return}S.cash-=q.dep;S.spent+=q.dep}
    S.apt={k:q.k,miss:0};sfx('level');notify('🔑 Moved into '+q.name+'!');toast('🔑 Welcome to '+q.name);save();rerender()})}

    stack.forEach((s,i)=>{const y=H-20-i*14;x.fillStyle=E(s)[2];
      if(s==='bun'){x.beginPath();if(i===0)x.ellipse(W/2,y,72,9,0,0,Math.PI*2);else x.ellipse(W/2,y+4,72,20,0,Math.PI,0);x.fill()}
      else if(s==='cheese'){poly(x,[W/2-74,y-4,W/2+74,y-4,W/2+60,y+6,W/2-60,y+6]);x.fill()}
      else{rr(x,W/2-74,y-6,148,12,6);x.fill()}})}
  function tap(k){if(stack.length>=order.length)return;const want=order[stack.length];if(k!==want){api.miss('❌ Wrong topping! Customer stormed off');next();return}
    stack.push(k);sfx('click');draw();if(stack.length===order.length){api.pay(3+order.length*1.2+Math.max(0,1-(gnow()-t0)/limit)*5);next()}}
  ING.forEach(g=>padBtn($('#pad'),'<b>'+g[1]+'</b>'+g[0],()=>tap(g[0])));
  next();
  return{tick(){const p=1-(gnow()-t0)/limit;if(p<=0){api.miss('😤 Too slow! Customer left');next();return}setBar($('#pat'),p)},bot(){tap(order[stack.length])}};
}
/* --- Cashier Chaos --- */
function makeCashier(el,api){
  const DEN=[[1000,'$10','💵'],[500,'$5','💵'],[100,'$1','💵'],[25,'25¢','🪙'],[10,'10¢','🪙'],[5,'5¢','🪙']];
  const GOODS=['🧃 Juice','🧦 Socks','🍫 Candy bar','🧴 Lotion','📓 Notebook','🕯️ Candle','🧸 Teddy','🎧 Earbuds'];
  el.innerHTML='<canvas id="cv"></canvas><div class="card row"><span class="cust" id="cust"></span><div class="ticket" id="tk"></div></div><div class="bar"><div id="pat"></div></div>'+
    '<div class="card center" style="font-size:18px;margin:6px 0">Change given: <b id="given">$0.00</b></div><div class="pad" id="pad" style="grid-template-columns:repeat(3,1fr)"></div>'+
    '<div class="row" style="margin-top:8px"><button class="btn alt" id="undo" style="flex:1">↩ Undo</button><button class="btn green" id="ok" style="flex:2">Give change ✔</button></div>';
  const W=Math.min(window.innerWidth-24,420),H=120,x=setupCanvas(el.querySelector('#cv'),W,H);let good='';
  function draw(){jobBg('register',x,W,H);x.font='30px sans-serif';x.textAlign='center';x.fillText($('#cust').textContent,W*.2,H-44);x.font='22px sans-serif';if(good)x.fillText(good.split(' ')[0],W*.55,H-30);
    x.fillStyle='#1b5e20';rr(x,W*.74,H-66,W*.2,22,4);x.fill();x.fillStyle='#b9f6ca';x.font='bold 12px monospace';x.fillText(price?cents(price):'',W*.84,H-50);x.textAlign='left'}
  let price,paid,given,t0;const limit=15000;
  const sum=()=>given.reduce((a,b)=>a+b,0);
  function next(){price=5*(20+rand(380));paid=[500,1000,2000].filter(v=>v>price)[0];given=[];t0=gnow();$('#cust').textContent=pick(CUSTOMERS);good=pick(GOODS);
    $('#tk').innerHTML=good+' costs <b>'+cents(price)+'</b><br>Customer hands you <b>'+cents(paid)+'</b>';upd();draw()}
  function upd(){$('#given').textContent=cents(sum())}
  function done(){const ch=paid-price;if(sum()===ch)api.pay(4+Math.max(0,1-(gnow()-t0)/limit)*6);else api.miss('❌ Wrong change! Needed '+cents(ch)+', gave '+cents(sum()));next()}
  DEN.forEach(d=>padBtn($('#pad'),'<b>'+d[2]+'</b>'+d[1],()=>{given.push(d[0]);sfx('click');upd()}));
  $('#undo').onclick=()=>{given.pop();upd()};$('#ok').onclick=done;
  next();
  return{tick(){const p=1-(gnow()-t0)/limit;if(p<=0){api.miss('😤 Customer gave up waiting');next();return}setBar($('#pat'),p)},
    bot(){const rem=paid-price-sum();if(rem===0)done();else{given.push(DEN.filter(d=>d[0]<=rem)[0][0]);upd()}}};
}
/* --- Shelf Stocker --- */
function makeShelf(el,api){
  const C=[['Red','#e53935'],['Blue','#1e63d6'],['Yellow','#fdd835'],['Green','#2e7d32'],['Purple','#7b1fa2'],['Orange','#fb8c00']];
  const P=['Soda','Cereal','Soap','Chips','Shampoo','Candy','Juice','Socks','Cookies','Glue'];
  el.innerHTML='<div class="bar"><div id="pat"></div></div><canvas id="cv"></canvas><div class="pad" id="pad" style="grid-template-columns:1fr 1fr"></div>';
  const W=Math.min(window.innerWidth-24,420),H=170,x=setupCanvas(el.querySelector('#cv'),W,H);
  let bins,target,t0,limit,n=0,streak=0;
  function next(){bins=shuffle(C).slice(0,4);target=pick(bins);const prod=pick(P);n++;limit=Math.max(2200,4600-n*80);t0=gnow();
    jobBg('aisle',x,W,H);
    rr(x,W/2-50,22,100,124,10);x.fillStyle=target[1];x.fill();x.strokeStyle='rgba(0,0,0,.4)';x.lineWidth=2;x.stroke();
    rr(x,W/2-40,62,80,36,6);x.fillStyle='#fff';x.fill();x.fillStyle='#222';x.font='bold 18px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(prod,W/2,80);
    const pad=$('#pad');pad.innerHTML='';
    bins.forEach((c,i)=>padBtn(pad,'<b>🗑️</b>'+c[0]+' bin',()=>tap(i),'background:'+c[1]+';color:'+(lum(c[1])>.6?'#222':'#fff')+';padding:18px 4px'))}
  function tap(i){if(bins[i]===target){streak++;api.pay(2+Math.min(streak,10)*.3+Math.max(0,1-(gnow()-t0)/limit)*2)}else{streak=0;api.miss('❌ That\'s the '+bins[i][0]+' bin!')}next()}
  next();
  return{tick(){const p=1-(gnow()-t0)/limit;if(p<=0){streak=0;api.miss('📦 Dropped it!');next();return}setBar($('#pat'),p)},bot(){tap(bins.indexOf(target))}};
}
/* --- Barista Brain --- */
function makeBarista(el,api){
  const ING=[['espresso','☕','#4e342e'],['milk','🥛','#f5f5f5'],['foam','☁️','#fff3d6'],['caramel','🍯','#c68e17'],['choco','🍫','#5d4037'],['ice','🧊','#b3e5fc'],['vanilla','🌼','#f3e5ab'],['matcha','🍵','#7cb342']];
  const E=k=>ING.filter(i=>i[0]===k)[0];
  el.innerHTML='<div class="card row"><span class="cust" id="cust"></span><div class="ticket" id="tk"></div></div><div class="bar"><div id="pat"></div></div><canvas id="cv"></canvas><div class="pad" id="pad"></div>';
  const W=Math.min(window.innerWidth-24,420),H=150,x=setupCanvas(el.querySelector('#cv'),W,H);
  let recipe,made,phase,t0,showUntil,limit,n=0;
  function next(){n++;const len=Math.min(3+Math.floor(n/3),6);recipe=[];for(let i=0;i<len;i++)recipe.push(pick(ING)[0]);made=[];phase='show';showUntil=gnow()+2600+len*700;limit=5000+len*1500;
    $('#cust').textContent=pick(CUSTOMERS);draw()}
  function draw(){$('#tk').innerHTML=phase==='show'?'<b>Memorize!</b> 👀<br>'+recipe.map(r=>'<span style="font-size:22px">'+E(r)[1]+'</span>').join(' '):'<b>Make it!</b> (in order)<br>'+recipe.map((r,i)=>'<span style="font-size:22px">'+(i<made.length?E(r)[1]:'❓')+'</span>').join(' ');
    jobBg('cafe',x,W,H);const cx=W/2,top=20,bot=H-12,hw=50,per=(bot-top-6)/recipe.length;
    made.forEach((m,i)=>{x.fillStyle=E(m)[2];const y2=bot-i*per,y1=y2-per;poly(x,[cx-hw+4,y1,cx+hw-4,y1,cx+hw-8,y2,cx-hw+8,y2]);x.fill()});
    x.strokeStyle='#555';x.lineWidth=3;x.beginPath();x.moveTo(cx-hw,top);x.lineTo(cx-hw+6,bot);x.lineTo(cx+hw-6,bot);x.lineTo(cx+hw,top);x.stroke();x.beginPath();x.arc(cx+hw+8,(top+bot)/2,14,-1.3,1.3);x.stroke()}
  function tap(k){if(phase==='show'){phase='make';t0=gnow()}
    if(k!==recipe[made.length]){api.miss('❌ That\'s not the recipe!');next();return}made.push(k);sfx('click');draw();
    if(made.length===recipe.length){api.pay(4+recipe.length*1.4+Math.max(0,1-(gnow()-t0)/limit)*5);next()}}
  ING.forEach(g=>padBtn($('#pad'),'<b>'+g[1]+'</b>'+g[0],()=>tap(g[0])));
  next();
  return{tick(){const now=gnow();if(phase==='show'){setBar($('#pat'),1);if(now>=showUntil){phase='make';t0=now;draw()}return}
      const p=1-(now-t0)/limit;if(p<=0){api.miss('😤 Drink took too long!');next();return}setBar($('#pat'),p)},
    bot(){tap(recipe[made.length])}};
}
/* --- Dog Walker --- */
function makeDog(el,api){
  el.innerHTML='<canvas id="cv"></canvas><div class="row" style="margin-top:8px"><button class="btn big" id="L" style="flex:1">◀</button><button class="btn big" id="R" style="flex:1">▶</button></div><div class="small center">Tap the left/right side of the path or the arrows</div>';
  const W=Math.min(window.innerWidth-24,420),H=330,cv=el.querySelector('#cv'),x=setupCanvas(cv,W,H),dogY=H-50;
  let lane=1,objs=[],spawn=0,speed=150,stun=0,tm=0;
  const lx=i=>W*(i+.5)/3, move=d=>{lane=Math.max(0,Math.min(2,lane+d));sfx('click')};
  $('#L').addEventListener('pointerdown',e=>{e.preventDefault();move(-1)});$('#R').addEventListener('pointerdown',e=>{e.preventDefault();move(1)});
  cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();move(e.clientX-r.left<W/2?-1:1)});
  function draw(){jobBg('park',x,W,H);x.fillStyle='rgba(224,214,195,.92)';x.fillRect(W*.05,0,W*.9,H);x.strokeStyle='#fff';x.lineWidth=3;x.setLineDash([16,14]);x.lineDashOffset=-tm*speed;
    line(x,W/3,0,W/3,H);line(x,2*W/3,0,2*W/3,H);x.setLineDash([]);x.font='34px serif';x.textAlign='center';x.textBaseline='middle';
    objs.forEach(o=>x.fillText({bone:'🦴',puddle:'💧',cat:'🐈',cone:'🚧'}[o.t],lx(o.lane),o.y));
    x.globalAlpha=stun>0&&Math.floor(stun*10)%2?.4:1;x.font='44px serif';x.fillText('🐕',lx(lane),dogY);x.globalAlpha=1;
    x.strokeStyle='#d32f2f';x.lineWidth=2;line(x,lx(lane),dogY+10,W/2,H)}
  draw();
  return{tick(dt){tm+=dt;speed+=dt*4;stun=Math.max(0,stun-dt);spawn-=dt;
      if(spawn<=0){spawn=.55+Math.random()*.4;objs.push({lane:rand(3),y:-20,t:Math.random()<.5?'bone':pick(['puddle','cat','cone'])})}
      objs.forEach(o=>{o.y+=speed*dt;if(!o.hit&&o.lane===lane&&Math.abs(o.y-dogY)<24){o.hit=1;if(o.t==='bone')api.pay(2.2);else if(stun<=0){stun=1;api.miss({puddle:'💦 Splash! Muddy pup',cat:'🐈 Pup chased a cat!',cone:'🚧 Bonk!'}[o.t])}}});
      objs=objs.filter(o=>o.y<H+30&&!(o.hit&&o.t==='bone'));draw()},
    bot(){const b={lane:rand(3),y:dogY-4,t:'bone'};objs=objs.filter(o=>o.t==='bone'||o.lane!==b.lane);objs.push(b);lane=b.lane}};
}
/* --- Pizza Dash --- */
function makePizza(el,api){
  el.innerHTML='<div class="card center" style="font-size:18px;margin-bottom:6px">Deliver to house <b id="tgt" style="font-size:26px;color:#d32f2f"></b></div><canvas id="cv"></canvas><button class="btn big" id="toss" style="margin-top:8px">🍕 TOSS!</button>';
  const W=Math.min(window.innerWidth-24,420),H=210,x=setupCanvas(el.querySelector('#cv'),W,H),zone=W/2,HC=['#ef9a9a','#90caf9','#a5d6a7','#fff59d','#ce93d8','#ffcc80'];
  let houses=[],speed=70,target=null,fly=0,used={};
  function addHouse(xp){let n;do{n=1+rand(99)}while(used[n]);used[n]=1;houses.push({x:xp,num:n,c:pick(HC)})}
  for(let i=0;i<7;i++)addHouse(W*.75+i*100);
  function newTarget(){const up=houses.filter(h=>h.x>zone+60&&!h.done);target=pick(up.slice(0,3));$('#tgt').textContent='#'+target.num}
  newTarget();
  function toss(){fly=.35;const h=houses.filter(q=>Math.abs(q.x-zone)<34&&!q.done)[0];
    if(h&&h===target){h.done=1;api.pay(6+speed/30);newTarget()}else api.miss(h?'🏠 Wrong house! That was #'+h.num:'🍕 Pizza on the sidewalk!')}
  $('#toss').addEventListener('pointerdown',e=>{e.preventDefault();toss()});
  function draw(){jobBg('street',x,W,H);x.fillStyle='#9e9e9e';x.fillRect(0,H-50,W,50);x.fillStyle='#fff';const off=(gnow()/12)%40;for(let i=-40;i<W+40;i+=40)x.fillRect(i-off,H-27,20,4);
    x.fillStyle='rgba(255,235,59,.35)';x.fillRect(zone-34,0,68,H-50);x.strokeStyle='#fbc02d';x.lineWidth=2;x.strokeRect(zone-34,1,68,H-52);
    houses.forEach(h=>{x.fillStyle=h.c;x.fillRect(h.x-30,70,60,90);x.fillStyle='#8d6e63';poly(x,[h.x-36,72,h.x+36,72,h.x,38]);x.fill();x.fillStyle='#5d4037';x.fillRect(h.x-8,128,16,32);
      x.fillStyle=h===target?'#d32f2f':'#fff';rr(x,h.x-16,82,32,22,5);x.fill();x.fillStyle=h===target?'#fff':'#222';x.font='bold 15px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(h.num,h.x,93);
      if(h.done){x.font='22px serif';x.fillText('✅',h.x,58)}});
    x.font='38px serif';x.fillText('🛵',zone,H-30);if(fly>0){x.font='26px serif';x.fillText('🍕',zone,H-60-(.35-fly)*250)}}
  draw();
  return{tick(dt){speed+=dt*1.5;fly=Math.max(0,fly-dt);houses.forEach(h=>{h.x-=speed*dt});
      if(target.x<zone-40&&!target.done){api.miss('⌛ Missed house #'+target.num+'!');newTarget()}
      houses=houses.filter(h=>{if(h.x<-50){delete used[h.num];return false}return true});while(houses[houses.length-1].x<W+300)addHouse(houses[houses.length-1].x+100);draw()},
    bot(){target.x=zone;toss()}};
}

/* ============================== BOOT ============================== */
function showError(e){const v=document.getElementById('view');if(v)v.innerHTML='<div class="card" style="color:#b00"><b>Oops, the game hit an error:</b><br>'+esc(e&&e.message||e)+'</div>'}
window.addEventListener('error',ev=>showError(ev.error||ev.message));
function boot(){
  try{
    if(!storageOK){const b=$('#banner');b.hidden=false;b.innerHTML='⚠️ This viewer blocks saving. Progress lasts only while it\'s open. Go to <b>⭐ Me → Export code</b> to keep it!'}
    $('#more').onclick=()=>{sfx('click');openMore()};
    $('#mail').onclick=()=>{sfx('click');openMail()};
    setInterval(()=>{clockTick();if(!S.char||!CLOCK.on)return;onlineTick();v8Tick();if(checkDay()){toast('☀️ Day '+S.day+'! Stores rotated & new deals');sfx('level');if(screen==='mall'&&!shift)rerender()}
      Array.prototype.forEach.call(document.querySelectorAll('.cd'),e=>{e.textContent=timeLeft()})},1000);
    screen=S.char?'mall':'create';nav();render();
    if(S.char)setTimeout(welcomeBack,600);
  }catch(e){showError(e)}
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
