 ['Green','#2e7d32'],['Mint','#98ff98'],['Teal','#00897b'],['Sky Blue','#4fc3f7'],['Royal Blue','#1e4fd6'],['Navy','#1a237e'],
 ['Purple','#7b1fa2'],['Lavender','#b39ddb'],['Burgundy','#800020'],['Brown','#6d4c41'],['Tan','#d2b48c'],['Beige','#f5f5dc'],

const BASES={

 tops:[B('tee','T-Shirt',1),B('tank','Tank Top',.7),B('hoodie','Hoodie',1.5),B('blazer','Blazer',3),B('puffer','Puffer Jacket',2.5),B('sweater','Sweater',1.4)],

 accessories:[B('sunglasses','Sunglasses',1,{plain:1}),B('chain','Chain Necklace',1.5,{plain:1}),B('handbag','Handbag',2.5),B('watch','Watch',2,{plain:1}),B('scarf','Scarf',.8)],
 furniture:[B('sofa','Sofa',3,{w:2,h:1}),B('bed','Bed',4,{w:2,h:2}),B('chair','Chair',1,{w:1,h:1}),B('table','Table',1.5,{w:2,h:1}),B('bookshelf','Bookshelf',2,{w:1,h:2}),B('bathtub','Bathtub',3,{w:2,h:1})],
 decor:[B('plant','Potted Plant',.5,{w:1,h:1}),B('lamp','Floor Lamp',.8,{w:1,h:1,plain:1}),B('rug','Rug',1,{w:2,h:2,layer:'rug'}),B('tv','TV',3,{w:2,h:1,plain:1}),B('fishtank','Fish Tank',2,{w:1,h:1,plain:1}),
  B('painting','Painting',1.5,{w:1,h:1,layer:'wall'}),B('clock','Wall Clock',.7,{w:1,h:1,layer:'wall',plain:1}),B('curtains','Curtained Window',1.2,{w:2,h:1,layer:'wall'}),B('poster','Poster',.4,{w:1,h:1,layer:'wall'}),B('wallshelf','Wall Shelf',.8,{w:2,h:1,layer:'wall'})],
 electronics:[B('console','Game Console',4,{w:1,h:1,plain:1}),B('phone','Smartphone',5,{w:1,h:1,plain:1}),B('speaker','Smart Speaker',1.5,{w:1,h:1,plain:1}),B('arcade','Arcade Cabinet',6,{w:1,h:2,plain:1}),B('laptop','Laptop',5,{w:1,h:1,plain:1}),B('vr','VR Headset',4,{w:1,h:1,plain:1}),B('gamingpc','Gaming PC',7,{w:1,h:1,plain:1})]
};
const STORES=[
 {id:'frauda',name:'Frauda',tag:'Milano-ish luxury',color:'#111',emoji:'👜',cats:['tops','bottoms','shoes','accessories'],tier:[400,9000]},
 {id:'goochie',name:'Goochie',tag:'Double G, double price',color:'#0a6b3a',emoji:'🐍',cats:['hats','tops','shoes','accessories'],tier:[300,7000]},
 {id:'balence',name:'BalenceNada',tag:'Ugly-chic, extra $$$',color:'#444',emoji:'👟',cats:['shoes','tops','bottoms','hats'],tier:[350,8000]},
 {id:'vuitno',name:'Louis Vuitno',tag:'Monogram everything',color:'#6b4a1e',emoji:'🧳',cats:['accessories','hats','decor'],tier:[500,15000]},
 {id:'shanel',name:'Shanel',tag:'No. 5 out of 10',color:'#000',emoji:'💄',cats:['tops','bottoms','accessories','shoes'],tier:[450,12000]},
 {id:'versnatchy',name:'Versnatchy',tag:'Medusa approved',color:'#b8860b',emoji:'👑',cats:['hats','tops','furniture','decor'],tier:[800,30000]},
 {id:'hermeez',name:'Hermeez',tag:'Waitlist for the waitlist',color:'#e65100',emoji:'🍊',cats:['accessories','furniture','decor'],tier:[2000,25000]},
 {id:'dollar',name:'Dollar Treet',tag:'Everything about a buck',color:'#2a9d3a',emoji:'💵',cats:['hats','accessories','decor','shoes'],tier:[1,5]},
 {id:'wally',name:"Wally's Mart",tag:'Save money. Live... ok.',color:'#1f6fd1',emoji:'🛒',cats:['tops','bottoms','shoes','furniture','decor'],tier:[4,60]},
 {id:'ikeya',name:'Ikeya',tag:'Some assembly required',color:'#0051ba',emoji:'🪑',cats:['furniture','decor'],tier:[15,400]},
 {id:'thrift',name:'Thrift Shift',tag:'Pre-loved, pre-smelled',color:'#9b59b6',emoji:'♻️',cats:['hats','tops','bottoms','shoes','furniture'],tier:[1,25]},
 {id:'targit',name:'Targit',tag:'Came for soap, left with a lamp',color:'#cc0000',emoji:'🎯',cats:['decor','furniture','tops','bottoms'],tier:[8,150]},
 {id:'worstbuy',name:'Worst Buy',tag:'Extended warranty? Extended regret.',color:'#0a2f8f',emoji:'🎮',cats:['electronics','decor'],tier:[40,2500]}
];
const BODIES={slim:{label:'Slim',sh:15,hip:12},average:{label:'Average',sh:17,hip:14},curvy:{label:'Curvy',sh:16,hip:18},broad:{label:'Broad',sh:21,hip:15},round:{label:'Round',sh:20,hip:19}};
const SKINS=['#ffe0c4','#f6c89f','#e0ac69','#c68642','#8d5524','#5c3a21'];
const HAIRS={buzz:'Buzz',short:'Short',spiky:'Spiky',bob:'Bob',long:'Long',ponytail:'Ponytail',bun:'Bun',afro:'Afro'};
const HAIR_COLORS=[['Black','#1f1410'],['Brown','#5a3825'],['Auburn','#a0522d'],['Blonde','#e6c27a'],['Silver','#c9c9c9'],['Pink','#ff6fb5'],['Blue','#3fa9f5'],['Purple','#7b4fd6']];
const GENDERS={male:{label:'Male',body:'broad',hair:'short'},female:{label:'Female',body:'curvy',hair:'long'},nb:{label:'Non-binary',body:'slim',hair:'bob'}};

/* ======================= ITEM GENERATION ======================= */
const rand=n=>Math.floor(Math.random()*n);
const pick=a=>a[rand(a.length)];
function rng(seed){seed=(seed>>>0)||1;return function(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}}
function shuffle(a,r){r=r||Math.random;a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
function nicePrice(p){return p<100?Math.max(1,Math.round(p)):p<1000?Math.round(p/5)*5:Math.round(p/50)*50}
const ITEMS=[], ITEM={};
(function gen(){
  const r=rng(2026), names={};
  function make(s,cat,base,rare){
    let it=null;
    for(let t=0;t<20&&!it;t++){
      const c=COLORS[Math.floor(r()*COLORS.length)];
      const pat=base.plain?PATTERNS[0]:(rare?SPARKLE:PATTERNS[Math.floor(r()*PATTERNS.length)]);
      const name=s.name+(rare?' Limited':'')+' '+c[0]+(pat.key?' '+pat.name:'')+' '+base.name;
      if(names[name])continue;names[name]=1;
      const lo=s.tier[0],hi=s.tier[1];
      let p=lo*Math.pow(hi/lo,Math.pow(r(),1.4))*base.mul;p=Math.min(Math.max(p,1),hi*2.5);if(rare)p*=3;
      it={id:s.id+'-'+cat+'-'+base.key+'-'+ITEMS.length,store:s.id,name:name,cat:cat,slot:SLOTS.indexOf(cat)>=0?cat:null,shape:base.key,
        price:nicePrice(p),color:c[1],colorName:c[0],pattern:pat.key,rare:!!rare,stock:rare?3:0,w:base.w||1,h:base.h||1,layer:base.layer||'floor'};
    }
    if(it){ITEMS.push(it);ITEM[it.id]=it}
  }
  STORES.forEach(s=>{
    s.cats.forEach(cat=>{shuffle(BASES[cat],r).slice(0,cat==='decor'?5:4).forEach(b=>make(s,cat,b,false))});
    const rc=s.cats[Math.floor(r()*s.cats.length)];make(s,rc,BASES[rc][Math.floor(r()*BASES[rc].length)],true);
  });
})();

/* ============ v3 ONLINE CATALOGS (generated after mall items so v2 save ids stay stable) ============ */
const MALL_STORE={};STORES.forEach(s=>{MALL_STORE[s.id]=1});
const KO_NAMES={frauda:'Fraudah',goochie:'Gucchi',balence:'BalenciNOPE',vuitno:'Louie Vootin',shanel:'Chanell',versnatchy:'Versnatchie',hermeez:'Hermeze'};
const KO_OF={};
(function genOnline(){
  const r=rng(777),names={};
  Object.keys(BASES).forEach(cat=>BASES[cat].forEach(base=>{
    for(let k=0;k<4;k++){let it=null;
      for(let t=0;t<20&&!it;t++){const c=COLORS[Math.floor(r()*COLORS.length)],pat=base.plain?PATTERNS[0]:PATTERNS[Math.floor(r()*PATTERNS.length)];
        const name='Clamazon Basics '+c[0]+(pat.key?' '+pat.name:'')+' '+base.name;if(names[name])continue;names[name]=1;
        const p=(4+r()*55)*base.mul*(cat==='electronics'?5:1);
        it={id:'clam-'+cat+'-'+base.key+'-'+k,store:'clamazon',name:name,cat:cat,slot:SLOTS.indexOf(cat)>=0?cat:null,shape:base.key,price:nicePrice(p),color:c[1],colorName:c[0],pattern:pat.key,rare:false,stock:0,w:base.w||1,h:base.h||1,layer:base.layer||'floor'}}
      if(it){ITEMS.push(it);ITEM[it.id]=it}}
  }));
  // knockoffs: what Facenook scammers actually ship you. Same look, sadder name, ~3% value.
  ITEMS.filter(i=>KO_NAMES[i.store]&&!i.rare).forEach(i=>{const s=STORES.filter(q=>q.id===i.store)[0];
    const ko=Object.assign({},i,{id:'ko-'+i.id,store:'knockoff',name:KO_NAMES[i.store]+i.name.slice(s.name.length)+' (knockoff)',price:Math.max(3,nicePrice(i.price*.03)),fake:true,real:i.id});
    ITEMS.push(ko);ITEM[ko.id]=ko;KO_OF[i.id]=ko.id});
})();
/* ========================= STATE / SAVES ========================= */
const $=q=>document.querySelector(q);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const money=n=>'$'+Math.floor(n).toLocaleString('en-US');
const cents=c=>'$'+(c/100).toFixed(2);
const KEY_AUTO='mrt2_auto', slotKey=n=>'mrt2_slot'+n;
const MEM={};
const storageOK=(function(){try{const k='__mrt_t';window.localStorage.setItem(k,'1');window.localStorage.removeItem(k);return true}catch(e){return false}})();
const store={
  get(k){if(storageOK){try{return window.localStorage.getItem(k)}catch(e){}}return Object.prototype.hasOwnProperty.call(MEM,k)?MEM[k]:null},

    h+='<div class="small">×'+owned+(it.slot?'':' · '+placed+' placed')+' · worth '+money(it.price)+'</div><div class="row"><button class="btn '+(eq?'alt':'green')+'" style="flex:1" data-a="use">'+(it.slot?(eq?'Take off':'Wear'):'Place')+'</button><button class="btn alt" style="flex:0 0 46px" data-a="sell" title="Sell for half">💲</button></div>'}
  d.innerHTML=h;
  onAll(d,'[data-a]',b=>{const a=b.dataset.a;
    if(a==='wish'){toggleWish(it);b.textContent=S.wish[it.id]?'❤️':'🤍'}
    else if(a==='buy')buy(it);
    else if(a==='steal')stealAttempt(it);
    else if(a==='sell')sell(it);
    else if(it.slot){if(eq)delete S.equipped[it.slot];else S.equipped[it.slot]=it.id;sfx('click');save();rerender()}
    else{room.placing=it.id;room.sel=-1;go('room')}});
  if(shopM)d.querySelector('[data-a=buy]').disabled=left<=0;
  return d;
}
function buy(it){
  const p=priceOf(it);
  if(stockLeft(it)<=0){toast('Sold out!');sfx('bad');return}
  if(S.cash<p){openPay(it.name,p,()=>grant(it,p));return}
  S.cash-=p;S.spent+=p;grant(it,p);
}
function grant(it,p){
  S.owned[it.id]=(S.owned[it.id]||0)+1;if(it.rare)S.stock[it.id]=(S.stock[it.id]||0)+1;if(offOf(it))S.dealsBought++;
  if(it.slot&&!S.equipped[it.slot])S.equipped[it.slot]=it.id;
  sfx('buy');floatText('-'+money(p),'#d32f2f');bumpCash();toast('Bought '+it.name+' ✨');save();rerender();
}
function sell(it){
  const v=Math.floor(it.price/2);S.owned[it.id]--;S.cash+=v;
  if(!S.owned[it.id]){delete S.owned[it.id];Object.keys(S.equipped).forEach(k=>{if(S.equipped[k]===it.id)delete S.equipped[k]});S.room=S.room.filter(q=>q.id!==it.id)}
  else{const pl=S.room.filter(q=>q.id===it.id);if(pl.length>S.owned[it.id])S.room.splice(S.room.indexOf(pl[0]),1)}
  sfx('coin');floatText('+'+money(v));toast('Sold for '+money(v));save();rerender();
}

/* ---------- ROOM ---------- */
const COLS=8,ROWS=10,WALL=3;
const room={placing:null,sel:-1};
function fits(id,X,Y,ignore){const it=ITEM[id];
  if(X<0||X+it.w>COLS||Y+it.h>ROWS)return false;
  if(it.layer==='wall'){if(Y<0||Y+it.h>WALL)return false}else if(Y<WALL)return false;
  return S.room.every((p,i)=>{if(i===ignore)return true;const q=ITEM[p.id];if(q.layer!==it.layer)return true;return X+it.w<=p.x||p.x+q.w<=X||Y+it.h<=p.y||p.y+q.h<=Y});
}
function renderRoom(v){
  const placeable=Object.keys(S.owned).map(id=>ITEM[id]).filter(i=>!i.slot);
  v.innerHTML='<div class="card small" id="hint"></div>';
  const c=Math.floor(Math.min(window.innerWidth-24,560)/COLS),cv=document.createElement('canvas'),x=setupCanvas(cv,c*COLS,c*ROWS);v.appendChild(cv);
  v.insertAdjacentHTML('beforeend','<div class="row" style="margin-top:8px" id="ctl"></div><div class="lbl">Your furniture & decor</div><div class="grid" id="plist"></div>');
  function draw(){
    x.clearRect(0,0,c*COLS,c*ROWS);
    for(let i=0;i<COLS;i++){x.fillStyle=i%2?'#f6d6e6':'#fbe3ef';x.fillRect(i*c,0,c,WALL*c)}
    for(let j=WALL;j<ROWS;j++){x.fillStyle=j%2?'#d4b08c':'#caa47e';x.fillRect(0,j*c,COLS*c,c);x.strokeStyle='rgba(0,0,0,.08)';x.lineWidth=1;for(let i=(j%2)*c/2;i<COLS*c;i+=c*1.5)line(x,i,j*c,i,(j+1)*c)}
    x.fillStyle='#fff';x.fillRect(0,WALL*c-4,COLS*c,4);
    if(room.placing||room.sel>=0){x.strokeStyle='rgba(255,255,255,.4)';x.lineWidth=1;for(let i=1;i<COLS;i++)line(x,i*c,0,i*c,ROWS*c);for(let j=1;j<ROWS;j++)line(x,0,j*c,COLS*c,j*c)}
    const order=S.room.map((p,i)=>({p:p,i:i,it:ITEM[p.id]}));
    const lay=l=>order.filter(o=>o.it.layer===l);
    lay('wall').concat(lay('rug')).forEach(o=>drawFurn(x,o.it,o.p.x*c,o.p.y*c,o.it.w*c,o.it.h*c));
    const objs=lay('floor').map(o=>({z:o.p.y+o.it.h,f:()=>drawFurn(x,o.it,o.p.x*c,o.p.y*c,o.it.w*c,o.it.h*c)}));
    objs.push({z:S.avatar.y+1.01,f:()=>{const sc=c*2.2/170;x.save();x.translate((S.avatar.x+.5)*c,(S.avatar.y+.92)*c-162*sc);x.scale(sc,sc);drawAvatar(x,S.char,S.equipped);x.restore()}});
    objs.sort((a,b)=>a.z-b.z).forEach(o=>o.f());
    drawDoorstep(x,c);
    if(room.sel>=0){const p=S.room[room.sel],it=ITEM[p.id];x.strokeStyle='#ff1493';x.lineWidth=3;x.setLineDash([6,4]);x.strokeRect(p.x*c+2,p.y*c+2,it.w*c-4,it.h*c-4);x.setLineDash([])}
    const P=room.placing&&ITEM[room.placing];
    $('#hint').innerHTML=P?'Tap a spot to place <b>'+esc(P.name)+'</b> ('+P.w+'×'+P.h+(P.layer==='wall'?', goes on the wall':P.layer==='rug'?', rug: furniture can sit on it':'')+')':
      room.sel>=0?'Tap a new spot to move <b>'+esc(ITEM[S.room[room.sel].id].name)+'</b>, or remove it.':'Tap furniture to move it · tap the floor to walk · 💤 Sleep starts a new day';
    const ctl=$('#ctl');const pk=packagesReady().length;ctl.innerHTML=(pk?'<button class="btn green" id="collect">📦 Bring in '+pk+' package'+(pk>1?'s':'')+'</button>':'')+(room.sel>=0?'<button class="btn" id="rm">Remove</button>':'')+(room.placing||room.sel>=0?'<button class="btn alt" id="cx">Cancel</button>':'')+'<button class="btn alt" id="sleep" style="margin-left:auto">💤 Sleep (next day)</button>';
    if($('#collect'))$('#collect').onclick=()=>{collect()};
    if($('#rm'))$('#rm').onclick=()=>{S.room.splice(room.sel,1);room.sel=-1;sfx('click');save();draw();list()};
    if($('#cx'))$('#cx').onclick=()=>{room.sel=-1;room.placing=null;draw();list()};
    $('#sleep').onclick=()=>{nextDay();sfx('level');toast('☀️ Good morning! Day '+S.day+': new stores & deals');draw()};
  }
  function list(){const pl=$('#plist');pl.innerHTML='';
    if(!placeable.length){pl.innerHTML='<div class="card">No furniture yet. Try Ikeya, Targit, Thrift Shift or Wally\'s Mart!</div>';return}
    placeable.forEach(it=>{const left=S.owned[it.id]-S.room.filter(p=>p.id===it.id).length;const b=document.createElement('div');b.className='item';
      b.innerHTML='<img alt="" src="'+thumb(it)+'"><div class="nm">'+esc(it.name)+'</div><div class="small">'+it.w+'×'+it.h+(it.layer==='wall'?' wall':'')+' · '+left+' to place</div><button class="btn" '+(left?'':'disabled')+'>'+(room.placing===it.id?'Placing…':'Place')+'</button>';
      b.querySelector('button').onclick=()=>{room.placing=it.id;room.sel=-1;sfx('click');draw();list();window.scrollTo(0,0)};pl.appendChild(b)})}
  cv.addEventListener('pointerdown',e=>{
    const r=cv.getBoundingClientRect(),gx=Math.floor((e.clientX-r.left)/c),gy=Math.floor((e.clientY-r.top)/c);
    const hits=S.room.map((p,i)=>i).filter(i=>{const p=S.room[i],it=ITEM[p.id];return gx>=p.x&&gx<p.x+it.w&&gy>=p.y&&gy<p.y+it.h}).sort((a,b)=>(ITEM[S.room[a].id].layer==='rug')-(ITEM[S.room[b].id].layer==='rug'));
    if(room.placing){const it=ITEM[room.placing];
      if(fits(room.placing,gx,gy,-1)){S.room.push({id:room.placing,x:gx,y:gy});sfx('buy');if(S.room.filter(p=>p.id===room.placing).length>=S.owned[room.placing])room.placing=null;save()}
      else{sfx('bad');toast(it.layer==='wall'&&gy>=WALL?'Wall decor goes on the wall (top area)':it.layer!=='wall'&&gy<WALL?'Put that on the floor':'Doesn\'t fit there')}}
    else if(room.sel>=0&&hits.indexOf(room.sel)<0){
      if(fits(S.room[room.sel].id,gx,gy,room.sel)){S.room[room.sel].x=gx;S.room[room.sel].y=gy;room.sel=-1;sfx('click');save()}else{sfx('bad');toast('Doesn\'t fit there')}}
    else if(hits.length){room.sel=hits[0]===room.sel?-1:hits[0];sfx('click')}
    else if(gy>=WALL){S.avatar={x:gx,y:gy};room.sel=-1;save()}
    draw();list();
  });
  draw();list();
}

const cycleDay=d=>((d-1)%28)+1;
function eventToday(){const d=cycleDay(S.day);return EVENTS.filter(e=>e.day===d)[0]||null}
function eventOff(it){const e=eventToday();return e?e.off(it):0}
function eventBanner(){const e=eventToday();if(e)return'<div class="evt">'+e.emoji+' <b>'+e.name+'</b> today! '+e.desc+'</div>';
  const d=cycleDay(S.day),nx=EVENTS.filter(q=>q.day>d)[0]||EVENTS[0],n=nx.day>d?nx.day-d:28-d+nx.day;return'<div class="small" style="margin:0 4px 8px">Next event: '+nx.emoji+' '+nx.name+' in '+n+' day'+(n>1?'s':'')+'</div>'}
function rating(it){const r=rng(hash(it.id));return{stars:Math.round((1.5+r()*3.5)*2)/2,count:Math.floor(r()*r()*25000)+3}}
function starStr(s){let o='';for(let i=1;i<=5;i++)o+=s>=i?'★':s>=i-.5?'⯪':'☆';return o}
function reviewsFor(it){const r=rng(hash(it.id)+9);const out=[];for(let i=0;i<3;i++){const c2=COLORS[Math.floor(r()*COLORS.length)][0];
  out.push({who:REVIEWERS[Math.floor(r()*REVIEWERS.length)],s:1+Math.floor(r()*5),t:REVIEWS[Math.floor(r()*REVIEWS.length)].replace('{n}',BASES[it.cat].filter(b=>b.key===it.shape)[0].name.toLowerCase()).replace('{c}',it.colorName).replace('{c2}',c2)})}return out}

function toggleWish(it){if(S.wish[it.id])delete S.wish[it.id];else{S.wish[it.id]=1;toast('💖 Added to wishlist. We\'ll ping you when it\'s on sale.')}sfx('click');save()}

/* ---------- money: Mall Rat Card + Pay in 4 ---------- */
const cardLimit=()=>Math.min(10000,500+100*S.shifts);
function payWith(m,amt,label){
  if(m==='cash'){if(S.cash<amt)return false;S.cash-=amt}
  else if(m==='card'){if(S.card.bal+amt>cardLimit())return false;S.card.bal+=amt}
  else{const part=Math.ceil(amt/4);if(S.cash<part)return false;S.cash-=part;S.bnpl.push({label:label,amt:part,left:3})}
  S.spent+=amt;bumpCash();if(S.card.bal>cardLimit()*.6)setTimeout(()=>toast('💳 Your card is getting heavy. Future-you just sighed audibly.'),1900);return true}
function openPay(title,amt,done,extra){
  const lim=cardLimit(),part=Math.ceil(amt/4);
  sheet('<h3>'+esc(title)+'</h3><div style="font-size:26px" class="pr">'+money(amt)+'</div>'+(extra||'')+
   '<button class="btn green big" data-m="cash" '+(S.cash>=amt?'':'disabled')+'>💵 Cash (you have '+money(S.cash)+')</button>'+
   '<button class="btn big" data-m="card" '+(S.card.bal+amt<=lim?'':'disabled')+'>💳 Mall Rat Card · '+money(lim-S.card.bal)+' left · 3%/day</button>'+
   '<button class="btn alt big" data-m="bnpl" '+(S.cash>=part?'':'disabled')+'>🐢 Pay in 4: '+money(part)+' now + 3 daily</button>'+
   '<p class="small">Credit is fun until it isn\'t. Card interest compounds every in-game day.</p>');
  onAll($('#sheet'),'[data-m]',b=>{if(payWith(b.dataset.m,amt,title)){closeSheet();done(b.dataset.m)}else{sfx('bad');toast('Payment declined 😬')}})}

/* ---------- daily processing ---------- */
function onNewDay(){
  if(S.card.bal>0){const i=Math.ceil(S.card.bal*CARD_RATE);S.card.bal+=i;if(S.card.bal>cardLimit()*.6)notify('💳 Card balance is '+money(S.card.bal)+' (+'+money(i)+' interest). No pressure. (Some pressure.)')}
  S.bnpl.forEach(b=>{if(S.cash>=b.amt)S.cash-=b.amt;else{S.card.bal+=b.amt+LATE_FEE;notify('🐢 Pay-in-4 for '+b.label+' bounced: moved to your card + '+money(LATE_FEE)+' late fee')}b.left--});S.bnpl=S.bnpl.filter(b=>b.left>0);
  if(S.crime.active&&S.day>=S.crime.next){if(S.cash>=CRIME_FEE){S.cash-=CRIME_FEE;S.crime.next=S.day+7;notify('📦 Clamazon Crime renewed ('+money(CRIME_FEE)+')')}
    else if(S.card.bal+CRIME_FEE<=cardLimit()){S.card.bal+=CRIME_FEE;S.crime.next=S.day+7;notify('📦 Crime renewed on your card')}else{S.crime.active=false;notify('📦 Crime membership lapsed (couldn\'t pay)')}}
  S.orders.forEach(o=>{if(o.status==='shipping'&&S.day>=o.arrive){o.status='delivered';notify('📦 Delivered: '+ITEM[o.id].name+' is on your doorstep!')}});
  fbRefresh();
  Object.keys(S.wish).forEach(id=>{const it=ITEM[id];if(it&&offOf(it))notify('💖 Wishlist alert: '+it.name+' is '+offOf(it)+'% off today!')});
  crimeNewDay();const e=eventToday();if(e){notify(e.emoji+' '+e.name+' starts today! '+e.desc);if(e.gift&&!S.gifted[S.day]){S.gifted[S.day]=1;S.cash+=e.gift}}
}

/* ---------- Fleabay ---------- */
const inc=a=>Math.max(1,Math.round(a.bid*.06));
const nextBid=a=>a.high?a.bid+inc(a):a.bid;
function fmtLeft(ms){const s=Math.max(0,Math.ceil(ms/1000));return s?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):'ended'}
function fleaRefill(){const now=Date.now(),pool=ITEMS.filter(i=>MALL_STORE[i.store]&&!i.rare);
  while(S.flea.filter(a=>!a.done&&a.seller!=='you').length<5){const it=pick(pool),st=Math.max(1,Math.round(it.price*.15));
    S.flea.push({aid:S.oid++,id:it.id,seller:pick(NPC),bid:st,high:null,end:now+(60+rand(180))*1000,npcMax:Math.round(it.price*(.45+Math.random()*.5)),escrow:0,done:false,bids:0})}}
function playerBid(a){if(a.done||a.high==='you'||a.seller==='you')return;const amt=nextBid(a);
  if(S.cash<amt){toast('You need '+money(amt)+' cash to back that bid');sfx('bad');return}
  S.cash-=amt;a.bid=amt;a.high='you';a.escrow=amt;a.bids++;if(a.end-Date.now()<10000)a.end=Date.now()+10000;sfx('coin');toast('🙌 You\'re the high bidder!');save();rerender()}
function npcBid(a){const amt=nextBid(a);if(amt>a.npcMax)return false;
  if(a.high==='you'){S.cash+=a.escrow;a.escrow=0;notify('😤 Outbid on '+ITEM[a.id].name+' (now '+money(amt)+')');toast('😤 Outbid on '+ITEM[a.id].name+'!');sfx('bad')}
  a.bid=amt;a.high=pick(NPC.filter(n=>n!==a.seller&&n!==a.high));a.bids++;return true}
function endAuction(a){a.done=true;const it=ITEM[a.claim||a.id];
  if(a.seller==='you'){if(a.high&&ITEM[a.id].fake&&fakeBust(ITEM[a.id],a.bid,'Fleabay')){notify('🚨 Fleabay flagged your "'+it.name+'" as counterfeit. Sale reversed, item seized.')}else if(a.high){if(ITEM[a.id].fake)S.rap.fakesSold++;const pay=Math.round(a.bid*.9);S.cash+=pay;S.stats3.flipped++;notify('💸 Sold '+it.name+' on Fleabay for '+money(a.bid)+' (you get '+money(pay)+' after the 10% fee)');toast('💸 Fleabay sale: +'+money(pay));sfx('coin')}
    else{S.owned[a.id]=(S.owned[a.id]||0)+1;notify('🦗 No bids on '+it.name+'. It came back home.')}}
  else if(a.high==='you'){S.orders.unshift({oid:S.oid++,id:a.id,src:'Fleabay',price:a.bid,day:S.day,arrive:S.day,status:'delivered'});S.stats3.won++;
    notify('🏆 You won '+it.name+' for '+money(a.bid)+'! It\'s on your doorstep.');toast('🏆 Won '+it.name+'!');sfx('level')}}
function removeOne(id){S.owned[id]--;if(!S.owned[id]){delete S.owned[id];Object.keys(S.equipped).forEach(k=>{if(S.equipped[k]===id)delete S.equipped[k]});S.room=S.room.filter(q=>q.id!==id)}
  else{const pl=S.room.filter(q=>q.id===id);if(pl.length>S.owned[id])S.room.splice(S.room.indexOf(pl[0]),1)}}
function listItem(it,start){removeOne(it.id);S.flea.push({aid:S.oid++,id:it.id,seller:'you',bid:start,high:null,end:Date.now()+120000,claim:it.fake?it.real:null,npcMax:Math.round((it.fake?ITEM[it.real]:it).price*(.35+Math.random()*.55)),escrow:0,done:false,bids:0});
  sfx('click');toast('🔨 Listed! Auction ends in 2:00');save();closeSheet();rerender()}
function onlineTick(){
  const now=Date.now();let ch=false;
  S.flea.forEach(a=>{if(a.done)return;if(now>=a.end){endAuction(a);ch=true;return}
    const p=(a.end-now)<15000?.3:.07;if((a.high==='you'||!a.high||a.seller==='you')&&Math.random()<p&&npcBid(a))ch=true});
  const before=S.flea.length;S.flea=S.flea.filter(a=>!a.done||now-a.end<300000);if(S.flea.length!==before)ch=true;
  if(S.flea.filter(a=>!a.done&&a.seller!=='you').length<5){fleaRefill();ch=true}
  if(S.fb.day!==S.day){fbRefresh();ch=true}
  if(ch){save();if(screen==='online'&&onTab==='flea'&&!sheetOpen())rerender()}
  Array.prototype.forEach.call(document.querySelectorAll('[data-end]'),e=>{e.textContent=fmtLeft(+e.dataset.end-now)});
}

/* ---------- Facenook Marketplace ---------- */
function fbRefresh(){const pool=ITEMS.filter(i=>MALL_STORE[i.store]&&!i.rare);S.fb={day:S.day,list:[]};
  for(let i=0;i<6;i++){const it=pick(pool),sl=pick(FB_SELLERS),ask=nicePrice(it.price*(.35+Math.random()*.35));
    S.fb.list.push({lid:S.oid++,id:it.id,seller:sl[0],face:sl[1],ask:ask,floor:Math.round(ask*(.6+Math.random()*.25)),scam:!!KO_OF[it.id]&&Math.random()<.3,status:'open',chat:[],counter:0,tries:0,asked:false})}}
function openFb(l){const it=ITEM[l.id];
  const chat=l.chat.map(m=>'<div class="bub '+(m[0]==='me'?'me':'')+'">'+esc(m[1])+'</div>').join('');
  sheet('<div class="row" style="align-items:flex-start"><img src="'+thumb(it)+'" style="width:76px;border-radius:10px"><div style="flex:1"><b>'+esc(it.name)+'</b><div class="small">'+l.face+' '+esc(l.seller)+' · retail '+money(it.price)+'</div><div class="pr">Asking '+money(l.ask)+'</div></div></div>'+
   '<div class="chat" id="chat">'+(chat||'<div class="small center">Say hi to the seller…</div>')+'</div>'+
   (l.status==='ghosted'?'<p class="center">👻 '+esc(l.seller)+' has left the chat. Forever.</p>':l.status==='sold'?'<p class="center">✅ You bought this.</p>':
   (!l.asked?'<button class="btn big" id="ask">👋 "Hi, is this still available?"</button>':
    '<div class="row"><input type="number" id="offer" inputmode="numeric" value="'+Math.round((l.counter||l.ask)*.75)+'" style="flex:1;width:auto"><button class="btn" id="off">Offer</button></div>'+
    (l.counter?'<button class="btn green big" id="acc">🤝 Accept '+money(l.counter)+'</button>':'')+'<button class="btn alt big" id="full">Pay asking price '+money(l.ask)+'</button>')));
  const ch=$('#chat');ch.scrollTop=ch.scrollHeight;
  const say=(w,t)=>l.chat.push([w,t]),ghost=()=>{l.status='ghosted';sfx('bad')};
  if($('#ask'))$('#ask').onclick=()=>{l.asked=true;say('me','Hi, is this still available?');
    if(Math.random()<.1){say('them','…');ghost()}else say('them',pick(['Yes!!! still available','yes. no lowballs I know what I have','Yeah but 3 other people want it','who is this','Yes 😊 porch pickup only, 2am','Available. Cash, Venmoo, or interesting rocks.']));save();openFb(l)};
  if($('#off'))$('#off').onclick=()=>{const v=parseInt($('#offer').value,10);if(!(v>0))return;l.tries++;say('me','Would you take '+money(v)+'?');
    if(v>=l.ask){l.counter=l.ask;say('them','Sure lol. '+money(l.ask)+' it is')}
    else if(v>=l.floor){l.counter=v;say('them',pick(['Ugh fine. '+money(v)+'. Come get it','Deal 🤝 '+money(v),'ok '+money(v)+' but you have to compliment my dog']))}
    else if(v>=l.floor*.75&&l.tries<5){l.counter=Math.max(l.floor,Math.round((v+l.ask)/2));say('them','Best I can do is '+money(l.counter))}
    else if(Math.random()<.35||l.tries>=5){say('them',pick(['lol','Seen ✓','🙄','Blocked.']));ghost()}
    else{l.counter=l.ask;say('them','lol no. '+money(l.ask)+' firm')}
    save();openFb(l)};
  const buyAt=p=>openPay('Facenook: '+it.name,p,()=>{l.status='sold';S.stats3.haggled++;maybeContact();
    if(l.scam){const ko=ITEM[KO_OF[l.id]];S.owned[ko.id]=(S.owned[ko.id]||0)+1;S.stats3.scammed++;notify('🤡 Facenook: your "'+it.name+'" is actually a '+ko.name+'. Worth '+money(ko.price)+'.');toast('🤡 Plot twist: it\'s a '+ko.name+' (worth '+money(ko.price)+')');sfx('bad')}
    else{S.owned[it.id]=(S.owned[it.id]||0)+1;toast('🎉 Got it for '+money(p)+'! (retail '+money(it.price)+')');sfx('buy')}save();rerender()});
  if($('#acc'))$('#acc').onclick=()=>buyAt(l.counter);if($('#full'))$('#full').onclick=()=>buyAt(l.ask);
}

/* ============================== CRIME & CONSEQUENCES (v4) ==============================
   Shoplifting stealth minigame, Heat, court (fine or community service), store bans,
   Back Alley counterfeits, counterfeit-selling busts, police raids. Satire: crime should
   never beat a burger shift on average. Test hooks: window.__stealForce / __bustForce / __raidForce. */
let stealIv=null;
const R=()=>S.rap;
const isBanned=id=>!!(S.rap.bans[id]&&S.day<=S.rap.bans[id]);
function heatColor(h){return h>=60?'#d32f2f':h>=30?'#f57c00':h>0?'#fbc02d':'#43a047'}
function heatPill(){const h=Math.round(R().heat);return'<span class="heat" style="background:'+heatColor(h)+'">🔥 Heat '+h+'</span> '}
function addHeat(n){R().heat=Math.min(100,R().heat+n)}
function storeOf(it){return STORES.filter(s=>s.id===it.store)[0]}
function security(it){const s=storeOf(it),hi=s?s.tier[1]:100;const a=Math.min(1,Math.log(hi)/Math.log(30000)),b=Math.min(1,Math.log(Math.max(1,priceOf(it)))/Math.log(50000));return Math.max(.05,Math.min(1,a*.6+b*.4))}

/* ---------- court ---------- */
function courtCase(c){
  const r=R(),prior=r.offenses;r.offenses++;r.caught++;addHeat(c.heat||15);
  const fine=Math.max(10,Math.round(c.base*(1.5+.25*Math.min(2,prior)))),cs=Math.min(6,2+prior),forced=prior>=2;
  let ban='';if(c.store){r.storeOff[c.store]=(r.storeOff[c.store]||0)+1;const n=r.storeOff[c.store];if(n>=2){r.bans[c.store]=S.day+2*(n-1);ban='<p>🚫 <b>Banned from '+esc(storeOf({store:c.store}).name)+' until Day '+r.bans[c.store]+'.</b> Your photo is now on the wall behind the register.</p>'}}
  const entry={day:S.day,what:c.what,pen:cs+' shifts community service'};r.record.unshift(entry);if(r.record.length>30)r.record.length=30;
  r.cs+=cs;notify('🚨 '+c.what+': '+(forced?cs+' shifts community service (assigned)':'court date pending'));sfx('bad');save();
  sheet('<h3>🚨 Busted!</h3><div style="font-size:44px;text-align:center">👮‍♀️'+(c.emoji||'🛍️')+'</div><p>'+esc(c.what)+'.'+(c.confiscated?' The item has been confiscated.':'')+'</p>'+
    '<div class="small">Offense #'+r.offenses+' · Heat '+Math.round(r.heat)+'/100</div>'+ban+
    (forced?'<p>⚖️ Judge Judgy has seen enough of you. <b>'+cs+' shifts of community service</b>, no fine option. Paid jobs are blocked until it\'s done.</p><button class="btn alt big" id="docs">🧹 Yes, Your Honor</button>':
     '<p>⚖️ Choose your penalty:</p><button class="btn big" id="payfine">💸 Pay a '+money(fine)+' fine</button><button class="btn alt big" id="docs">🧹 '+cs+' shifts of community service (unpaid, blocks paid jobs)</button>'));
  $('#docs').onclick=()=>{closeSheet();toast('🧹 Report to 💼 Work for community service');rerender()};
  if($('#payfine'))$('#payfine').onclick=()=>openPay('Court fine',fine,()=>{r.cs=Math.max(0,r.cs-cs);r.finesPaid+=fine;entry.pen='Fine '+money(fine);toast('⚖️ Fine paid. Try to stay boring.');save();rerender()});
}

/* ---------- shoplifting stealth minigame ---------- */
function stealAttempt(it){
  if(isBanned(it.store)){toast('🚫 You\'re banned here');return}
  const sec=security(it),half=.22+.5*sec,speed=1.3+2.4*sec,lvl=sec<.3?'low 😴':sec<.6?'medium 👀':'HIGH 🚨';
  sheet('<h3>🤏 Five-finger discount?</h3><div class="small">'+esc(it.name)+' · security <b>'+lvl+'</b>. Tap GRAB while the camera looks away. Getting caught means a fine or community service. '+heatPill()+'</div><canvas id="stc"></canvas><div class="bar"><div id="stt"></div></div>'+
    '<button class="btn big" id="grab" style="background:#7b1fa2;box-shadow:0 2px 0 #4a148c">🤏 GRAB</button><button class="btn alt big" id="walk">😇 Never mind (buy it like a normal person)</button>');
  const W=Math.min(window.innerWidth-40,420),H=170,x=setupCanvas($('#stc'),W,H),img=new Image();img.src=thumb(it);
  const t0=Date.now(),LIMIT=7000;let ang=0,done=false;
  function draw(){const t=(Date.now()-t0)/1000;ang=Math.sin(t*speed)*1.15;const seen=Math.abs(ang)<half;
    x.fillStyle='#fff3e0';x.fillRect(0,0,W,H);x.fillStyle='#bcaaa4';x.fillRect(0,H-40,W,40);x.fillStyle='#8d6e63';x.fillRect(W/2-60,H-58,120,10);
    const cx=W/2,cy=14,len=H*1.4;x.fillStyle=seen?'rgba(244,67,54,.35)':'rgba(255,235,59,.3)';x.beginPath();x.moveTo(cx,cy);
    x.arc(cx,cy,len,Math.PI/2+ang-half,Math.PI/2+ang+half);x.closePath();x.fill();
    x.font='26px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('📹',cx,cy);
    if(img.complete)x.drawImage(img,cx-30,H-110,60,60);x.font='bold 13px sans-serif';x.fillStyle=seen?'#d32f2f':'#2e7d32';x.fillText(seen?'👁️ WATCHING':'✅ looking away',cx,H-18);
    const p=1-(Date.now()-t0)/LIMIT;setBar($('#stt'),p);
    if(p<=0&&!done){done=true;clearInterval(stealIv);closeSheet();toast('😅 You lost your nerve. Probably for the best.')}}
  clearInterval(stealIv);stealIv=setInterval(draw,30);draw();
  $('#walk').onclick=()=>{closeSheet();buy(it)};
  $('#grab').onclick=()=>{if(done)return;done=true;clearInterval(stealIv);const seen=Math.abs(ang)<half;
    let caught=seen?Math.random()<.9:Math.random()<(.04+.22*sec+R().heat/400);
    if(window.__stealForce)caught=window.__stealForce==='caught';
    closeSheet();
    if(!caught){S.owned[it.id]=(S.owned[it.id]||0)+1;if(it.rare)S.stock[it.id]=(S.stock[it.id]||0)+1;R().stolen++;const h=Math.round(3+8*sec);addHeat(h);
      sfx('buy');toast('😈 Got away with it… for now. Heat +'+h);save();rerender()}
    else courtCase({what:'Caught shoplifting '+it.name+' from '+storeOf(it).name,base:priceOf(it),store:it.store,heat:Math.round(15+20*sec),confiscated:true,emoji:'🤏'})};
}

  cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;const o=L.filter(o=>Math.hypot(o.x-px,o.y-py)<30)[0];if(o)grab(o)});
  function draw(){x.fillStyle='#a5d6a7';x.fillRect(0,0,W,H);x.fillStyle='#81c784';for(let i=0;i<8;i++){circ(x,(i*97)%W,(i*61)%H,30);x.fill()}x.fillStyle='#d7ccc8';x.fillRect(0,H/2-14,W,28);

function makeBurger(el,api){

    const pad=$('#pad');pad.innerHTML='';
    bins.forEach((c,i)=>padBtn(pad,'<b>🗑️</b>'+c[0]+' bin',()=>tap(i),'background:'+c[1]+';color:'+(lum(c[1])>.6?'#222':'#fff')+';padding:18px 4px'))}
  function tap(i){if(bins[i]===target){streak++;api.pay(2+Math.min(streak,10)*.3+Math.max(0,1-(Date.now()-t0)/limit)*2)}else{streak=0;api.miss('❌ That\'s the '+bins[i][0]+' bin!')}next()}
  next();
  return{tick(){const p=1-(Date.now()-t0)/limit;if(p<=0){streak=0;api.miss('📦 Dropped it!');next();return}setBar($('#pat'),p)},bot(){tap(bins.indexOf(target))}};
}
/* --- Barista Brain --- */
function makeBarista(el,api){
  const ING=[['espresso','☕','#4e342e'],['milk','🥛','#f5f5f5'],['foam','☁️','#fff3d6'],['caramel','🍯','#c68e17'],['choco','🍫','#5d4037'],['ice','🧊','#b3e5fc'],['vanilla','🌼','#f3e5ab'],['matcha','🍵','#7cb342']];
  const E=k=>ING.filter(i=>i[0]===k)[0];
  el.innerHTML='<div class="card row"><span class="cust" id="cust"></span><div class="ticket" id="tk"></div></div><div class="bar"><div id="pat"></div></div><canvas id="cv"></canvas><div class="pad" id="pad"></div>';
  const W=Math.min(window.innerWidth-24,420),H=150,x=setupCanvas(el.querySelector('#cv'),W,H);
  let recipe,made,phase,t0,showUntil,limit,n=0;
  function next(){n++;const len=Math.min(3+Math.floor(n/3),6);recipe=[];for(let i=0;i<len;i++)recipe.push(pick(ING)[0]);made=[];phase='show';showUntil=Date.now()+1500+len*450;limit=5000+len*1500;
    $('#cust').textContent=pick(CUSTOMERS);draw()}
  function draw(){$('#tk').innerHTML=phase==='show'?'<b>Memorize!</b> 👀<br>'+recipe.map(r=>'<span style="font-size:22px">'+E(r)[1]+'</span>').join(' '):'<b>Make it!</b> (in order)<br>'+recipe.map((r,i)=>'<span style="font-size:22px">'+(i<made.length?E(r)[1]:'❓')+'</span>').join(' ');
    x.fillStyle='#fdf6ec';x.fillRect(0,0,W,H);const cx=W/2,top=20,bot=H-12,hw=50,per=(bot-top-6)/recipe.length;
    made.forEach((m,i)=>{x.fillStyle=E(m)[2];const y2=bot-i*per,y1=y2-per;poly(x,[cx-hw+4,y1,cx+hw-4,y1,cx+hw-8,y2,cx-hw+8,y2]);x.fill()});
    x.strokeStyle='#555';x.lineWidth=3;x.beginPath();x.moveTo(cx-hw,top);x.lineTo(cx-hw+6,bot);x.lineTo(cx+hw-6,bot);x.lineTo(cx+hw,top);x.stroke();x.beginPath();x.arc(cx+hw+8,(top+bot)/2,14,-1.3,1.3);x.stroke()}
  function tap(k){if(phase==='show'){phase='make';t0=Date.now()}
    if(k!==recipe[made.length]){api.miss('❌ That\'s not the recipe!');next();return}made.push(k);sfx('click');draw();
    if(made.length===recipe.length){api.pay(4+recipe.length*1.4+Math.max(0,1-(Date.now()-t0)/limit)*5);next()}}
  ING.forEach(g=>padBtn($('#pad'),'<b>'+g[1]+'</b>'+g[0],()=>tap(g[0])));
  next();
  return{tick(){const now=Date.now();if(phase==='show'){setBar($('#pat'),1);if(now>=showUntil){phase='make';t0=now;draw()}return}
      const p=1-(now-t0)/limit;if(p<=0){api.miss('😤 Drink took too long!');next();return}setBar($('#pat'),p)},
    bot(){tap(recipe[made.length])}};
}
/* --- Dog Walker --- */
function makeDog(el,api){
  el.innerHTML='<canvas id="cv"></canvas><div class="row" style="margin-top:8px"><button class="btn big" id="L" style="flex:1">◀</button><button class="btn big" id="R" style="flex:1">▶</button></div><div class="small center">Tap the left/right side of the path or the arrows</div>';
  const W=Math.min(window.innerWidth-24,420),H=330,cv=el.querySelector('#cv'),x=setupCanvas(cv,W,H),dogY=H-50;
  let lane=1,objs=[],spawn=0,speed=150,stun=0,tm=0;
  const lx=i=>W*(i+.5)/3, move=d=>{lane=Math.max(0,Math.min(2,lane+d));sfx('click')};
  $('#L').addEventListener('pointerdown',e=>{e.preventDefault();move(-1)});$('#R').addEventListener('pointerdown',e=>{e.preventDefault();move(1)});
  cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();move(e.clientX-r.left<W/2?-1:1)});
  function draw(){x.fillStyle='#8bc34a';x.fillRect(0,0,W,H);x.fillStyle='#e0d6c3';x.fillRect(W*.05,0,W*.9,H);x.strokeStyle='#fff';x.lineWidth=3;x.setLineDash([16,14]);x.lineDashOffset=-tm*speed;
    line(x,W/3,0,W/3,H);line(x,2*W/3,0,2*W/3,H);x.setLineDash([]);x.font='34px serif';x.textAlign='center';x.textBaseline='middle';
    objs.forEach(o=>x.fillText({bone:'🦴',puddle:'💧',cat:'🐈',cone:'🚧'}[o.t],lx(o.lane),o.y));
    x.globalAlpha=stun>0&&Math.floor(stun*10)%2?.4:1;x.font='44px serif';x.fillText('🐕',lx(lane),dogY);x.globalAlpha=1;
    x.strokeStyle='#d32f2f';x.lineWidth=2;line(x,lx(lane),dogY+10,W/2,H)}
  draw();
  return{tick(dt){tm+=dt;speed+=dt*4;stun=Math.max(0,stun-dt);spawn-=dt;
      if(spawn<=0){spawn=.55+Math.random()*.4;objs.push({lane:rand(3),y:-20,t:Math.random()<.5?'bone':pick(['puddle','cat','cone'])})}
      objs.forEach(o=>{o.y+=speed*dt;if(!o.hit&&o.lane===lane&&Math.abs(o.y-dogY)<24){o.hit=1;if(o.t==='bone')api.pay(2.2);else if(stun<=0){stun=1;api.miss({puddle:'💦 Splash! Muddy pup',cat:'🐈 Pup chased a cat!',cone:'🚧 Bonk!'}[o.t])}}});
      objs=objs.filter(o=>o.y<H+30&&!(o.hit&&o.t==='bone'));draw()},
    bot(){const b={lane:rand(3),y:dogY-4,t:'bone'};objs=objs.filter(o=>o.t==='bone'||o.lane!==b.lane);objs.push(b);lane=b.lane}};
}
/* --- Pizza Dash --- */
function makePizza(el,api){
  el.innerHTML='<div class="card center" style="font-size:18px;margin-bottom:6px">Deliver to house <b id="tgt" style="font-size:26px;color:#d32f2f"></b></div><canvas id="cv"></canvas><button class="btn big" id="toss" style="margin-top:8px">🍕 TOSS!</button>';
  const W=Math.min(window.innerWidth-24,420),H=210,x=setupCanvas(el.querySelector('#cv'),W,H),zone=W/2,HC=['#ef9a9a','#90caf9','#a5d6a7','#fff59d','#ce93d8','#ffcc80'];
  let houses=[],speed=70,target=null,fly=0,used={};
  function addHouse(xp){let n;do{n=1+rand(99)}while(used[n]);used[n]=1;houses.push({x:xp,num:n,c:pick(HC)})}
  for(let i=0;i<7;i++)addHouse(W*.75+i*100);
  function newTarget(){const up=houses.filter(h=>h.x>zone+60&&!h.done);target=pick(up.slice(0,3));$('#tgt').textContent='#'+target.num}
  newTarget();
  function toss(){fly=.35;const h=houses.filter(q=>Math.abs(q.x-zone)<34&&!q.done)[0];
    if(h&&h===target){h.done=1;api.pay(6+speed/30);newTarget()}else api.miss(h?'🏠 Wrong house! That was #'+h.num:'🍕 Pizza on the sidewalk!')}
  $('#toss').addEventListener('pointerdown',e=>{e.preventDefault();toss()});
  function draw(){x.fillStyle='#bbdefb';x.fillRect(0,0,W,H);x.fillStyle='#9e9e9e';x.fillRect(0,H-50,W,50);x.fillStyle='#fff';const off=(Date.now()/12)%40;for(let i=-40;i<W+40;i+=40)x.fillRect(i-off,H-27,20,4);
    x.fillStyle='rgba(255,235,59,.35)';x.fillRect(zone-34,0,68,H-50);x.strokeStyle='#fbc02d';x.lineWidth=2;x.strokeRect(zone-34,1,68,H-52);
    houses.forEach(h=>{x.fillStyle=h.c;x.fillRect(h.x-30,70,60,90);x.fillStyle='#8d6e63';poly(x,[h.x-36,72,h.x+36,72,h.x,38]);x.fill();x.fillStyle='#5d4037';x.fillRect(h.x-8,128,16,32);
      x.fillStyle=h===target?'#d32f2f':'#fff';rr(x,h.x-16,82,32,22,5);x.fill();x.fillStyle=h===target?'#fff':'#222';x.font='bold 15px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(h.num,h.x,93);
      if(h.done){x.font='22px serif';x.fillText('✅',h.x,58)}});
    x.font='38px serif';x.fillText('🛵',zone,H-30);if(fly>0){x.font='26px serif';x.fillText('🍕',zone,H-60-(.35-fly)*250)}}
  draw();
  return{tick(dt){speed+=dt*1.5;fly=Math.max(0,fly-dt);houses.forEach(h=>{h.x-=speed*dt});
      if(target.x<zone-40&&!target.done){api.miss('⌛ Missed house #'+target.num+'!');newTarget()}
      houses=houses.filter(h=>{if(h.x<-50){delete used[h.num];return false}return true});while(houses[houses.length-1].x<W+300)addHouse(houses[houses.length-1].x+100);draw()},
    bot(){target.x=zone;toss()}};
}

function showError(e){const v=document.getElementById('view');if(v)v.innerHTML='<div class="card" style="color:#b00"><b>Oops, the game hit an error:</b><br>'+esc(e&&e.message||e)+'</div>'}
window.addEventListener('error',ev=>showError(ev.error||ev.message));
function boot(){
  try{
    if(!storageOK){const b=$('#banner');b.hidden=false;b.innerHTML='⚠️ This viewer blocks saving. Progress lasts only while it\'s open. Go to <b>⭐ Me → Export code</b> to keep it!'}
    $('#more').onclick=()=>{sfx('click');openMore()};
    $('#mail').onclick=()=>{sfx('click');openMail()};
    setInterval(()=>{if(!S.char)return;onlineTick();if(checkDay()){toast('☀️ Day '+S.day+'! Stores rotated & new deals');sfx('level');if(screen==='mall'&&!shift)rerender()}
      Array.prototype.forEach.call(document.querySelectorAll('.cd'),e=>{e.textContent=timeLeft()})},1000);
    screen=S.char?'mall':'create';nav();render();
  }catch(e){showError(e)}
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
